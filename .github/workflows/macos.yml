name: macOS

on:
  pull_request:
  workflow_dispatch:

jobs:
  wheel-install:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel, clean venv install (binary wheels only), doctor
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --only-binary :all: dist/*.whl
          "$RUNNER_TEMP/clean/bin/nexus-agent-ai" --version
          "$RUNNER_TEMP/clean/bin/nexus-agent-ai" doctor --no-network
          "$RUNNER_TEMP/clean/bin/python" -m pip list | tee pip.txt
          ! grep -iE "pyyaml|huggingface" pip.txt
      - name: Tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/ -q --tb=short

  first-run:
    # Real engine + model download and one chat. Manual only (slow, downloads ~0.7 GB).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: First run with small model and one chat
        env:
          NEXUS_AGENT_MODEL_REPO: LiquidAI/LFM2.5-1.2B-Instruct-GGUF
          NEXUS_AGENT_MODEL_FILENAME: LFM2.5-1.2B-Instruct-Q4_0.gguf
          NEXUS_AGENT_ASSUME_YES: "1"
        run: |
          set -o pipefail
          nexus-agent chat -p local "say hi in five words" 2>&1 | tee chat.log
          test "$(wc -c < chat.log)" -gt 3
