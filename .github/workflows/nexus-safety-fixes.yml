name: Apply reviewed Nexus safety fixes
on:
  push:
    branches: [fix/security-real-user-audit]
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'ci: apply tested Nexus safety fixes on review branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-real-user-audit
      - name: Apply reviewed source payload
        env:
          PAYLOAD: 
        run: |
          python - <<'PYCODE'
          import os, base64, hashlib, io, zipfile
          from pathlib import Path
          data=base64.b64decode(os.environ['PAYLOAD'])
          assert hashlib.sha256(data).hexdigest() == "6008fa26c2c500a3c1bdc804ee336825bdc76766e6a401b78a9731dd26ea5fe6"
          root=Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in archive.namelist():
                  target=(root/name).resolve()
                  assert target.is_relative_to(root) and not name.startswith('.github/')
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.read(name))
          PYCODE
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify before commit
        run: |
          python -m pip install -e '.[dev,cloud]' build
          python -m pytest -q
          python -m build
      - name: Commit verified changes to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/nexus-safety-fixes.yml
          git add README.md pyproject.toml requirements.txt .env.example src tests .github/workflows/nexus-safety-fixes.yml
          git commit -m 'fix: enforce tool capabilities, protect context and test real-user flows'
          git push origin HEAD:fix/security-real-user-audit
