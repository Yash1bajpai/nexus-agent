name: Nexus free cloud static pipeline proof
on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact reviewer-approved free fallback
        required: true
        type: choice
        options:
          - nvidia/nemotron-3-ultra-550b-a55b:free
permissions:
  contents: read
concurrency:
  group: nexus-free-cloud-daily-budget
  cancel-in-progress: false
jobs:
  static_a_b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 019e54eee0882ac7629869fa83959a1d8d55c582
          persist-credentials: false
          path: product
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate pins and secret-reference scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = 019e54eee0882ac7629869fa83959a1d8d55c582
          test -z "$(git -C product status --porcelain)"
          python harness/ci/cloud_scope_gate.py harness
          python -m venv "$RUNNER_TEMP/cloud-venv"
          "$RUNNER_TEMP/cloud-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r harness/ci/cloud-requirements.lock
          "$RUNNER_TEMP/cloud-venv/bin/python" -m pip install --no-deps --no-build-isolation ./product
          "$RUNNER_TEMP/cloud-venv/bin/python" -m pip freeze --all > "$RUNNER_TEMP/cloud-pip-freeze.txt"
          mkdir -p "$RUNNER_TEMP/cloud-home"
      - name: Static smoke A and B N=5, no fixture execution
        timeout-minutes: 41
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
          HOME: ${{ runner.temp }}/cloud-home
          PYTHONNOUSERSITE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          NEXUS_AGENT_ASSUME_YES: '1'
        shell: bash
        run: |
          set -euo pipefail
          unset NEXUS_ALLOW_PROJECT_EXECUTION NEXUS_ALLOW_GIT_COMMIT PYTHONPATH
          "$RUNNER_TEMP/cloud-venv/bin/python" -I harness/ci/cloud_static_driver.py --product "$GITHUB_WORKSPACE/product" --output "$RUNNER_TEMP/cloud-evidence" --model "$MODEL"
      - name: Secret-pattern artifact scan, fail and delete on hit
        if: always()
        id: scan
        env:
          PYTHONNOUSERSITE: '1'
        shell: bash
        run: |
          python -I harness/ci/cloud_scope_gate.py --scan "$RUNNER_TEMP/cloud-evidence"
      - name: Upload scanned evidence only
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-static-A-B-evidence
          path: ${{ runner.temp }}/cloud-evidence
          if-no-files-found: error
          retention-days: 7
# Zone B intentionally absent. No code/fixture execution job is permitted.
# New dispatches need separate daily-budget reconciliation and reviewer approval.
