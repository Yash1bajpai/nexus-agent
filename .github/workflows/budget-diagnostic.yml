name: Synthetic budget diagnostic (reviewed first push, Windows)

# R11_ROUTE_LIFECYCLE_V1 is not approval or a server-side one-shot lock.
# Independent review must bind the final commit/tree AND verifier before use.
# Immediately before ONE approved push, verify this exact remote ref is absent.
# No branch reuse/recreation, reruns, or followup commits; never use DEV/main.
on:
  push:
    branches:
      - diagnostic/r11-budget-590f748-2d91c6a7

permissions:
  contents: read

jobs:
  diagnostic:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/diagnostic/r11-budget-590f748-2d91c6a7' &&
      github.event.created == true &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.event.after == github.sha &&
      github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm checkout identity before build or model access
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) { throw 'Checkout SHA mismatch' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify R11_ROUTE_LIFECYCLE_V1 before build or model access
        run: |
          python -I "$env:GITHUB_WORKSPACE/.github/diagnostics/verify_reviewed_candidate.py" --repo "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed candidate invariant rejected' }
      - name: Build one fresh wheel and install isolated environment
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'budget-diagnostic-build'
          New-Item -ItemType Directory -Path $build -ErrorAction Stop | Out-Null
          python -m pip wheel --no-deps --wheel-dir "$build/wheel" .
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          $wheels = @(Get-ChildItem "$build/wheel/*.whl")
          if ($wheels.Count -ne 1) { throw 'Expected exactly one fresh wheel' }
          python -m venv "$build/venv"
          if ($LASTEXITCODE -ne 0) { throw 'Venv creation failed' }
          & "$build/venv/Scripts/python.exe" -m pip install --only-binary=:all: $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Fresh wheel installation failed' }
      - name: Native Windows lifecycle preflight before model fetch
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'budget-diagnostic-build'
          & "$build/venv/Scripts/python.exe" -I "$env:GITHUB_WORKSPACE/tests/test_windows_diagnostic_job.py" --native-preflight
          if ($LASTEXITCODE -ne 0) { throw 'Native owned-job lifecycle preflight failed; no model fetch' }
      - name: Fetch and hash only the explicitly approved GGUF
        run: |
          $ErrorActionPreference = 'Stop'
          $model = Join-Path $env:RUNNER_TEMP 'budget-diagnostic-model.gguf'
          if (Test-Path $model) { throw 'Model staging path must be fresh' }
          curl.exe --fail --location --max-time 420 --output $model 'https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/main/LFM2.5-1.2B-Instruct-Q4_0.gguf'
          if ($LASTEXITCODE -ne 0) { throw 'Model fetch failed; no retry' }
          $digest = (Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant()
          if ($digest -cne '2ea801949d760cdf1a2cc04a54262c22c3c0c54f0769d57760c9adeb0e59233f') { throw 'Model SHA256 mismatch' }
      - name: Run only seven frozen synthetic commands with offline replay
        env:
          EXPECTED_SHA: ${{ github.sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'budget-diagnostic-build'
          $wheel = @(Get-ChildItem "$build/wheel/*.whl")
          if ($wheel.Count -ne 1) { throw 'Expected exactly one fresh wheel' }
          $runner = Join-Path $env:GITHUB_WORKSPACE '.github/diagnostics/budget_diagnostic_runner.py'
          Set-Location $env:RUNNER_TEMP
          & "$build/venv/Scripts/python.exe" -I $runner --root "$env:RUNNER_TEMP/budget-diagnostic-run" --model-source "$env:RUNNER_TEMP/budget-diagnostic-model.gguf" --wheel $wheel[0].FullName --source-root $env:GITHUB_WORKSPACE --commit $env:ACTUAL_SHA --expected-commit $env:EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic capture/replay incomplete; inspect dedicated output' }
      - name: Upload dedicated bounded diagnostic output only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-budget-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/budget-diagnostic-run/output/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
