name: Nexus bigger-model reliability (Stages A/B/C)

# EXPERIMENTAL REF ONLY. Dispatch-only. Nothing merges to main, no
# default-model change, no artifact uploads, no cache, no secrets in env.
# Evidence goes to the job console and step summary only; the reviewer reads
# raw logs, never job conclusions.
#
# Job graph: smoke_a (engine tool-call gate, fail-fast) -> stage_b,
# stage_c1..c4 as parallel independent jobs (each needs: smoke_a). A model
# that fails Stage A is engine-incompatible; B/C are skipped automatically.
#
# Per-job mechanics (every job): ephemeral GitHub-hosted windows-latest
# runner, actions/checkout with persist-credentials: false, permissions
# contents: read, isolated RUNNER_TEMP HOME, wheel built from the target_sha
# checkout with git HEAD/tree + tools.py SHA256 recorded (never asserted
# against a hardcoded value), venv install, ONE model download via
# pull-model under NEXUS_AGENT_MODEL_REPO/FILENAME overrides with the model
# SHA256 recorded as evidence (no upstream GGUF digests exist to pin),
# pinned llama.cpp b7075 engine (fail-closed ZIP SHA256), PYTHONIOENCODING
# and NEXUS_AGENT_ASSUME_YES=1 in job init, convention-level dead proxies
# for proxy-aware clients before measured iterations (not socket enforcement),
# per-turn timeouts enforced inside the
# drivers, exact-count verdict lines only.
# Load-bearing isolation: no secrets, no persisted checkout credentials,
# public fixtures and ephemeral runner teardown. Raw sockets can bypass proxies.
#
# Model slate (dispatch one run per model, in this order):
#   1. bartowski/Qwen2.5-7B-Instruct-GGUF        Qwen2.5-7B-Instruct-Q4_K_M.gguf        (~4.7 GB)
#   2. LiquidAI/LFM2.5-8B-A1B-GGUF               LFM2.5-8B-A1B-Q4_K_M.gguf              (~5.2 GB, CONTROL)
#   3. bartowski/Meta-Llama-3.1-8B-Instruct-GGUF Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf (~4.9 GB)
#   4. bartowski/Mistral-7B-Instruct-v0.3-GGUF   Mistral-7B-Instruct-v0.3-Q4_K_M.gguf   (~4.4 GB, optional)
# Repo/filename existence verified at authoring time via HF resolve HEAD
# (HTTP 302, x-linked-size matches the expected sizes). No upstream SHA256
# pins exist for these GGUFs; record the per-download SHA256 in reports.

on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: "HF GGUF repo (e.g. bartowski/Qwen2.5-7B-Instruct-GGUF)"
        required: true
        type: string
        default: "bartowski/Qwen2.5-7B-Instruct-GGUF"
      model_filename:
        description: "GGUF filename inside the repo"
        required: true
        type: string
        default: "Qwen2.5-7B-Instruct-Q4_K_M.gguf"
      target_sha:
        description: "Product commit/tag under test (wheel is built from this)"
        required: true
        type: string
        default: "019e54eee0882ac7629869fa83959a1d8d55c582"  # tag v2.10.5
      context_size:
        description: "Engine/CLI context size for measured runs"
        required: true
        type: string
        default: "4096"

permissions:
  contents: read

jobs:
  # =========================================================================
  # STAGE A: raw engine tool-call gate (single combined test step)
  # =========================================================================
  smoke_a:
    runs-on: windows-latest
    timeout-minutes: 45  # spec ~15 min; headroom for a 5.2 GB model download
    env:
      MODEL_REPO: ${{ inputs.model_repo }}
      MODEL_FILE: ${{ inputs.model_filename }}
      TARGET_SHA: ${{ inputs.target_sha }}
      CONTEXT_SIZE: ${{ inputs.context_size }}
      SERVER_PORT: "18080"
    steps:
      - name: Initialize isolated environment
        id: init
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $isoHome = "$env:RUNNER_TEMP\isolated_home"
          New-Item -ItemType Directory -Force $isoHome | Out-Null
          "USERPROFILE=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONUNBUFFERED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONIOENCODING=utf-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_AGENT_ASSUME_YES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:USERPROFILE = $isoHome
          $env:HOME = $isoHome
          $env:PYTHONPATH = ""
          $drive = (Get-PSDrive -Name ($env:RUNNER_TEMP.Split(':')[0]))
          Write-Host ("Free disk on {0}: {1:N1} GB" -f $drive.Name, ($drive.Free/1GB))
          Write-Host "Isolated profile initialized under $isoHome"

      - name: Checkout experimental ref (ci scripts)
        id: checkout_ci
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout target product SHA
        id: checkout_product
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          path: product-src
          persist-credentials: false

      - name: Setup Python 3.12
        id: setup_python
        timeout-minutes: 2
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record product provenance and build wheel
        id: wheel
        timeout-minutes: 10
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $gitHead = ([string]::Join("`n", @(git -C product-src rev-parse HEAD))).Trim()
          Write-Host "PRODUCT GIT HEAD: $gitHead"
          if ($gitHead -ne $env:TARGET_SHA) { throw "checkout ref mismatch: $gitHead != $env:TARGET_SHA" }
          $gitTree = ([string]::Join("`n", @(git -C product-src rev-parse 'HEAD^{tree}'))).Trim()
          Write-Host "PRODUCT GIT TREE: $gitTree"
          $gitStatus = ([string]::Join("`n", @(git -C product-src status --porcelain))).Trim()
          if ($gitStatus) { throw "Dirty worktree is not an exact committed source run" }
          $toolsHash = (Get-FileHash -Algorithm SHA256 "product-src\src\nexus_agent_ai\agent\tools.py").Hash.ToLower()
          Write-Host "PRODUCT tools.py SHA256: $toolsHash  (recorded as evidence; NOT asserted)"
          python -m pip wheel --no-deps -w wheelhouse .\product-src
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip wheel): $rc"
          if ($rc -ne 0) { throw "wheel build failed with exit code $rc" }
          $whl = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          Write-Host "WHEEL: $($whl.Name) SHA256=$((Get-FileHash -Algorithm SHA256 $whl.FullName).Hash.ToLower())"
          "WHEEL_PATH=$($whl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create venv and install wheel
        id: venv
        timeout-minutes: 8
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install "$env:WHEEL_PATH"
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip install): $rc"
          if ($rc -ne 0) { throw "wheel install failed with exit code $rc" }
          .\.venv\Scripts\nexus-agent.exe --version
          Write-Host "CLI_EXE=$PWD\.venv\Scripts\nexus-agent.exe"
          "CLI_EXE=$PWD\.venv\Scripts\nexus-agent.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download model via pull-model and record SHA256
        id: model
        timeout-minutes: 15
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          # pull-model honors NEXUS_AGENT_MODEL_REPO / NEXUS_AGENT_MODEL_FILENAME.
          $env:NEXUS_AGENT_MODEL_REPO = $env:MODEL_REPO
          $env:NEXUS_AGENT_MODEL_FILENAME = $env:MODEL_FILE
          .\.venv\Scripts\nexus-agent.exe pull-model
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pull-model): $rc"
          if ($rc -ne 0) { throw "pull-model failed with exit code $rc" }
          $hit = Get-ChildItem -Recurse -Filter $env:MODEL_FILE "$env:USERPROFILE\.nexus-agent" | Select-Object -First 1
          if (-not $hit) { throw "downloaded model file $env:MODEL_FILE not found under isolated home" }
          $hash = (Get-FileHash -Algorithm SHA256 $hit.FullName).Hash.ToLower()
          Write-Host "MODEL_PATH=$($hit.FullName)"
          Write-Host "MODEL_SIZE_BYTES=$($hit.Length)"
          Write-Host "MODEL_SHA256=$hash  (no upstream pin exists; recorded for the review log)"
          "MODEL_PATH=$($hit.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify pinned llama.cpp b7075 engine
        id: engine
        timeout-minutes: 5
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $zip = "$env:RUNNER_TEMP\llama-b7075-bin-win-cpu-x64.zip"
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/b7075/llama-b7075-bin-win-cpu-x64.zip"
          curl.exe -L --fail --silent --show-error -o $zip $url
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (engine download): $rc"
          if ($rc -ne 0) { throw "engine download failed with exit code $rc" }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Write-Host "Engine ZIP SHA256: $hash"
          $expected = "ee57177a13347b386e8c097908fbb7f37c814f8a9c2948aef64f843a93221f13"
          if ($hash -ne $expected) { throw "Engine SHA256 mismatch: got $hash expected $expected" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\llama-server" -Force
          $exe = Get-ChildItem -Recurse -Filter llama-server.exe "$env:RUNNER_TEMP\llama-server" | Select-Object -First 1
          if (-not $exe) { throw "llama-server.exe not found after extraction" }
          "ENGINE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Engine extracted: $($exe.FullName)"

      - name: Lock down network for the measured step
        id: lockdown
        timeout-minutes: 1
        shell: pwsh
        run: |
          "HTTP_PROXY=http://127.0.0.1:9" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HTTPS_PROXY=http://127.0.0.1:9" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALL_PROXY=http://127.0.0.1:9" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NO_PROXY=localhost,127.0.0.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Network locked down for the measured step (dead proxy; loopback only)."

      - name: Test 0 - combined engine smoke (readiness, requests, wire dumps, verdict)
        id: test0
        timeout-minutes: 25
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $logPath = "$env:RUNNER_TEMP\test0-server.log"
          $srvArgs = @(
            "-m", $env:MODEL_PATH,
            "--alias", "bigmodel-test0",
            "-c", $env:CONTEXT_SIZE,
            "--parallel", "1",
            "--port", $env:SERVER_PORT,
            "--host", "127.0.0.1",
            "-t", "4",
            "--jinja",
            "--temp", "0.1",
            "--top-k", "50",
            "--repeat-penalty", "1.1"
          )
          Write-Host "Launch: $($env:ENGINE_EXE) $($srvArgs -join ' ')"
          $proc = Start-Process -FilePath $env:ENGINE_EXE -ArgumentList $srvArgs `
            -RedirectStandardOutput $logPath -RedirectStandardError "$env:RUNNER_TEMP\test0-server.err.log" `
            -PassThru -NoNewWindow
          Write-Host "llama-server PID: $($proc.Id)"
          try {
            python ci\smoke_a_test0.py `
              --tools-py product-src\src\nexus_agent_ai\agent\tools.py `
              --port $env:SERVER_PORT --alias bigmodel-test0 `
              --evidence-dir "$env:RUNNER_TEMP\test0_evidence"
            $rc = $LASTEXITCODE
            Write-Host "Raw Exit Code (smoke_a_test0): $rc"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Write-Host "--- server log head (version lines) ---"
            if (Test-Path $logPath) { Get-Content $logPath -TotalCount 30 }
            Write-Host "--- server log tail ---"
            if (Test-Path $logPath) { Get-Content $logPath -Tail 40 }
          }
          if ($rc -ne 0) { throw "TEST 0 FAILED: engine-incompatible model; stage_b/c skipped (fail-fast, honest)" }

      - name: Publish step summary
        id: summary
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $p = "$env:RUNNER_TEMP\test0_evidence\summary.md"
          if (Test-Path $p) { Get-Content $p | Add-Content $env:GITHUB_STEP_SUMMARY }
          else { "- **Execution Status:** INCOMPLETE (terminated before verdict)" | Add-Content $env:GITHUB_STEP_SUMMARY }

  # =========================================================================
  # STAGE B: existing N=5 two-turn calc.py harness (observe_normal_turns.py),
  # unchanged, at context_size. Comparability anchor.
  # Anchor revision confirmed by reviewer: b0d9361 (run85 observer 86b9299 +
  # exactly a 7-line --context-size passthrough on both turn commands); at the
  # 4096 default this is behavior-identical to run85. --context-size is passed
  # unconditionally. One fresh workspace + fresh session per iteration.
  # =========================================================================
  stage_b:
    needs: smoke_a
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      MODEL_REPO: ${{ inputs.model_repo }}
      MODEL_FILE: ${{ inputs.model_filename }}
      TARGET_SHA: ${{ inputs.target_sha }}
      CONTEXT_SIZE: ${{ inputs.context_size }}
    steps:
      - name: Initialize isolated environment
        id: init
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $isoHome = "$env:RUNNER_TEMP\isolated_home"
          New-Item -ItemType Directory -Force $isoHome | Out-Null
          "USERPROFILE=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONUNBUFFERED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONIOENCODING=utf-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_AGENT_ASSUME_YES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:USERPROFILE = $isoHome
          $env:HOME = $isoHome
          $env:PYTHONPATH = ""
          Write-Host "Isolated profile initialized under $isoHome"

      - name: Checkout experimental ref (ci scripts)
        id: checkout_ci
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout target product SHA
        id: checkout_product
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          path: product-src
          persist-credentials: false

      - name: Setup Python 3.12
        id: setup_python
        timeout-minutes: 2
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record product provenance and build wheel
        id: wheel
        timeout-minutes: 10
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $gitHead = ([string]::Join("`n", @(git -C product-src rev-parse HEAD))).Trim()
          Write-Host "PRODUCT GIT HEAD: $gitHead"
          if ($gitHead -ne $env:TARGET_SHA) { throw "checkout ref mismatch: $gitHead != $env:TARGET_SHA" }
          $gitTree = ([string]::Join("`n", @(git -C product-src rev-parse 'HEAD^{tree}'))).Trim()
          Write-Host "PRODUCT GIT TREE: $gitTree"
          $gitStatus = ([string]::Join("`n", @(git -C product-src status --porcelain))).Trim()
          if ($gitStatus) { throw "Dirty worktree is not an exact committed source run" }
          $toolsHash = (Get-FileHash -Algorithm SHA256 "product-src\src\nexus_agent_ai\agent\tools.py").Hash.ToLower()
          Write-Host "PRODUCT tools.py SHA256: $toolsHash  (recorded as evidence; NOT asserted)"
          python -m pip wheel --no-deps -w wheelhouse .\product-src
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip wheel): $rc"
          if ($rc -ne 0) { throw "wheel build failed with exit code $rc" }
          $whl = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          Write-Host "WHEEL: $($whl.Name) SHA256=$((Get-FileHash -Algorithm SHA256 $whl.FullName).Hash.ToLower())"
          "WHEEL_PATH=$($whl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create venv and install wheel
        id: venv
        timeout-minutes: 8
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install "$env:WHEEL_PATH"
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip install): $rc"
          if ($rc -ne 0) { throw "wheel install failed with exit code $rc" }
          "CLI_EXE=$PWD\.venv\Scripts\nexus-agent.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download model via pull-model and record SHA256
        id: model
        timeout-minutes: 15
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:NEXUS_AGENT_MODEL_REPO = $env:MODEL_REPO
          $env:NEXUS_AGENT_MODEL_FILENAME = $env:MODEL_FILE
          .\.venv\Scripts\nexus-agent.exe pull-model
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pull-model): $rc"
          if ($rc -ne 0) { throw "pull-model failed with exit code $rc" }
          $hit = Get-ChildItem -Recurse -Filter $env:MODEL_FILE "$env:USERPROFILE\.nexus-agent" | Select-Object -First 1
          if (-not $hit) { throw "downloaded model file $env:MODEL_FILE not found under isolated home" }
          Write-Host "MODEL_PATH=$($hit.FullName)"
          Write-Host "MODEL_SIZE_BYTES=$($hit.Length)"
          Write-Host "MODEL_SHA256=$((Get-FileHash -Algorithm SHA256 $hit.FullName).Hash.ToLower())  (no upstream pin exists; recorded for the review log)"

      - name: Warmup (product downloads its pinned b7075 engine; model load)
        id: warmup
        timeout-minutes: 25
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:NEXUS_AGENT_MODEL_REPO = $env:MODEL_REPO
          $env:NEXUS_AGENT_MODEL_FILENAME = $env:MODEL_FILE
          $wsw = "$env:RUNNER_TEMP\warmup_ws"; New-Item -ItemType Directory -Force $wsw | Out-Null
          Push-Location $wsw
          try {
            ."$env:CLI_EXE" chat -p local --verbose --no-stream --persist --session "warmup-$([guid]::NewGuid().ToString('N').Substring(0,8))" "Reply with the single word ok."
            $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (warmup chat): $rc"
            if ($rc -ne 0) { throw "warmup chat failed with exit code $rc" }
          } finally { Pop-Location }
          $eng = Get-ChildItem -Recurse -Filter "llama-server*.exe" "$env:USERPROFILE\.nexus-agent" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($eng) { Write-Host "PRODUCT ENGINE: $($eng.FullName) SHA256=$((Get-FileHash -Algorithm SHA256 $eng.FullName).Hash.ToLower()) (product pin b7075, recorded as evidence)" }
          else { Write-Host "PRODUCT ENGINE: not found under isolated home (recorded; product manages its own engine path)" }

      - name: Lock down network for measured iterations
        id: lockdown
        timeout-minutes: 1
        shell: pwsh
        run: |
          # Convention-level only: proxy-aware clients fail fast against a dead
          # proxy; raw sockets can bypass it. This is not egress enforcement.
          # Isolation relies on no secrets/credentials and ephemeral teardown.
          # Loopback and runner telemetry remain available.
          "HTTP_PROXY=http://127.0.0.1:9" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HTTPS_PROXY=http://127.0.0.1:9" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALL_PROXY=http://127.0.0.1:9" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NO_PROXY=localhost,127.0.0.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Network locked down for measured iterations (dead proxy; loopback only)."

      - name: Run Stage B harness N=5 (fresh workspace and session per iteration)
        id: run
        timeout-minutes: 120
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:NEXUS_AGENT_MODEL_REPO = $env:MODEL_REPO
          $env:NEXUS_AGENT_MODEL_FILENAME = $env:MODEL_FILE
          $completed = 0
          for ($k = 1; $k -le 5; $k++) {
            Write-Host "`nITERATION $k START scenario=stage_b"
            $ws = "$env:RUNNER_TEMP\scratch\stage_b\iter$k"
            $ev = "$env:RUNNER_TEMP\evidence\stage_b\iter$k"
            New-Item -ItemType Directory -Force $ws, $ev | Out-Null
            $sid = "bigmodel-stageb-$k-$([guid]::NewGuid().ToString('N').Substring(0,8))"
            # Anchor revision confirmed by reviewer: b0d9361 (run85 observer 86b9299
            # + 7-line --context-size passthrough on BOTH turn commands). Dispatch
            # ref must carry ci/observe_normal_turns.py at b0d9361 or later.
            python ci\observe_normal_turns.py --workspace $ws --evidence-dir $ev --cli-exe "$env:CLI_EXE" --session-id $sid --context-size $env:CONTEXT_SIZE
            $rc = $LASTEXITCODE
            Write-Host "Raw Exit Code (observe_normal_turns iter $k): $rc"
            if ($rc -eq 0) { $completed++ }
            Write-Host "ITERATION $k END scenario=stage_b rc=$rc"
          }
          Write-Host "`nSTAGE B ITERATIONS COMPLETED: $completed/5 (harness exit 0)"
          Write-Host "STAGE B: applied/clean counts and verdicts are the reviewer's call from the raw diffs above; no extrapolation here."
          if ($completed -eq 0) { throw "STAGE B: 0/5 iterations completed" }

      - name: Publish step summary
        id: summary
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Get-ChildItem "$env:RUNNER_TEMP\evidence\stage_b" -Recurse -Filter summary.md -ErrorAction SilentlyContinue | ForEach-Object {
            "## $($_.Directory.Name)" | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $_.FullName | Add-Content $env:GITHUB_STEP_SUMMARY
          }

  # =========================================================================
  # STAGE C1-C4: held-out scenarios, one independent parallel job each.
  # =========================================================================
  stage_c1:
    needs: smoke_a
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      MODEL_REPO: ${{ inputs.model_repo }}
      MODEL_FILE: ${{ inputs.model_filename }}
      TARGET_SHA: ${{ inputs.target_sha }}
      CONTEXT_SIZE: ${{ inputs.context_size }}
      SCENARIO: c1
      ITERATIONS: "5"
    steps:
      - name: Initialize isolated environment
        id: init
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $isoHome = "$env:RUNNER_TEMP\isolated_home"
          New-Item -ItemType Directory -Force $isoHome | Out-Null
          "USERPROFILE=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONUNBUFFERED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONIOENCODING=utf-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_AGENT_ASSUME_YES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:USERPROFILE = $isoHome
          $env:HOME = $isoHome
          $env:PYTHONPATH = ""
          Write-Host "Isolated profile initialized under $isoHome"

