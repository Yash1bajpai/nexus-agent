          $isoHome = "$env:RUNNER_TEMP\isolated_home"
          New-Item -ItemType Directory -Force $isoHome | Out-Null
          "USERPROFILE=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONUNBUFFERED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONIOENCODING=utf-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_AGENT_ASSUME_YES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:USERPROFILE = $isoHome
          $env:HOME = $isoHome
          $env:PYTHONPATH = ""
          Write-Host "Isolated profile initialized under $isoHome"

      - name: Checkout experimental ref (ci scripts)
        id: checkout_ci
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout target product SHA
        id: checkout_product
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          path: product-src
          persist-credentials: false

      - name: Setup Python 3.12
        id: setup_python
        timeout-minutes: 2
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record product provenance and build wheel
        id: wheel
        timeout-minutes: 10
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $gitHead = ([string]::Join("`n", @(git -C product-src rev-parse HEAD))).Trim()
          Write-Host "PRODUCT GIT HEAD: $gitHead"
          if ($gitHead -ne $env:TARGET_SHA) { throw "checkout ref mismatch: $gitHead != $env:TARGET_SHA" }
          $gitTree = ([string]::Join("`n", @(git -C product-src rev-parse 'HEAD^{tree}'))).Trim()
          Write-Host "PRODUCT GIT TREE: $gitTree"
          $gitStatus = ([string]::Join("`n", @(git -C product-src status --porcelain))).Trim()
          if ($gitStatus) { throw "Dirty worktree is not an exact committed source run" }
          $toolsHash = (Get-FileHash -Algorithm SHA256 "product-src\src\nexus_agent_ai\agent\tools.py").Hash.ToLower()
          Write-Host "PRODUCT tools.py SHA256: $toolsHash  (recorded as evidence; NOT asserted)"
          python -m pip wheel --no-deps -w wheelhouse .\product-src
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip wheel): $rc"
          if ($rc -ne 0) { throw "wheel build failed with exit code $rc" }
          $whl = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          Write-Host "WHEEL: $($whl.Name) SHA256=$((Get-FileHash -Algorithm SHA256 $whl.FullName).Hash.ToLower())"
          "WHEEL_PATH=$($whl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create venv and install wheel
        id: venv
        timeout-minutes: 8
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install "$env:WHEEL_PATH"
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip install): $rc"
          if ($rc -ne 0) { throw "wheel install failed with exit code $rc" }
          "CLI_EXE=$PWD\.venv\Scripts\nexus-agent.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download model via pull-model and record SHA256
        id: model
        timeout-minutes: 15
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:NEXUS_AGENT_MODEL_REPO = $env:MODEL_REPO
          $env:NEXUS_AGENT_MODEL_FILENAME = $env:MODEL_FILE
          .\.venv\Scripts\nexus-agent.exe pull-model
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pull-model): $rc"
          if ($rc -ne 0) { throw "pull-model failed with exit code $rc" }
          $hit = Get-ChildItem -Recurse -Filter $env:MODEL_FILE "$env:USERPROFILE\.nexus-agent" | Select-Object -First 1
          if (-not $hit) { throw "downloaded model file $env:MODEL_FILE not found under isolated home" }
          Write-Host "MODEL_PATH=$($hit.FullName)"
          Write-Host "MODEL_SIZE_BYTES=$($hit.Length)"
          Write-Host "MODEL_SHA256=$((Get-FileHash -Algorithm SHA256 $hit.FullName).Hash.ToLower())  (no upstream pin exists; recorded for the review log)"

      - name: Warmup (product downloads its pinned b7075 engine; model load)
        id: warmup
        timeout-minutes: 25
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:NEXUS_AGENT_MODEL_REPO = $env:MODEL_REPO
          $env:NEXUS_AGENT_MODEL_FILENAME = $env:MODEL_FILE
          $wsw = "$env:RUNNER_TEMP\warmup_ws"; New-Item -ItemType Directory -Force $wsw | Out-Null
          Push-Location $wsw
          try {
            ."$env:CLI_EXE" chat -p local --verbose --no-stream --persist --session "warmup-$([guid]::NewGuid().ToString('N').Substring(0,8))" "Reply with the single word ok."
            $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (warmup chat): $rc"
            if ($rc -ne 0) { throw "warmup chat failed with exit code $rc" }
          } finally { Pop-Location }
          $eng = Get-ChildItem -Recurse -Filter "llama-server*.exe" "$env:USERPROFILE\.nexus-agent" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($eng) { Write-Host "PRODUCT ENGINE: $($eng.FullName) SHA256=$((Get-FileHash -Algorithm SHA256 $eng.FullName).Hash.ToLower()) (product pin b7075, recorded as evidence)" }
          else { Write-Host "PRODUCT ENGINE: not found under isolated home (recorded; product manages its own engine path)" }

      - name: Lock down network for measured iterations
        id: lockdown
        timeout-minutes: 1
        shell: pwsh
        run: |
          "HTTP_PROXY=http://127.0.0.1:9" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HTTPS_PROXY=http://127.0.0.1:9" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALL_PROXY=http://127.0.0.1:9" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NO_PROXY=localhost,127.0.0.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Network locked down for measured iterations (dead proxy; loopback only)."

      - name: Run Stage C4 driver (N=3)
        id: run
        timeout-minutes: 120
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:NEXUS_AGENT_MODEL_REPO = $env:MODEL_REPO
          $env:NEXUS_AGENT_MODEL_FILENAME = $env:MODEL_FILE
          python ci\stage_c_driver.py --scenario $env:SCENARIO --iterations $env:ITERATIONS `
            --cli-exe "$env:CLI_EXE" `
            --scratch-root "$env:RUNNER_TEMP\scratch\$env:SCENARIO" `
            --evidence-root "$env:RUNNER_TEMP\evidence\$env:SCENARIO" `
            --context-size $env:CONTEXT_SIZE `
            --session-prefix bigmodel --oracle ci\oracle_stage_c.py
          $rc = $LASTEXITCODE
          Write-Host "Raw Exit Code (stage_c_driver): $rc"
          if ($rc -ne 0) { throw "STAGE $($env:SCENARIO): not all iterations passed (exact counts in log above)" }

      - name: Publish step summary
        id: summary
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $p = "$env:RUNNER_TEMP\evidence\$env:SCENARIO\summary.md"
          if (Test-Path $p) { Get-Content $p | Add-Content $env:GITHUB_STEP_SUMMARY }
          else { "- **Execution Status:** INCOMPLETE (terminated before final counts)" | Add-Content $env:GITHUB_STEP_SUMMARY }
