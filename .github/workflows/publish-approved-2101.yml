name: Publish approved Nexus 2.10.1
on:
  push:
    branches: [release/pypi-2.10.1]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.head_commit.message == 'release: publish approved nexus-agent-ai 2.10.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25c7779b5366fc1e7686f8d4b60fce52baac6342
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify approved source and build
        run: |
          test "$(git rev-parse HEAD)" = 25c7779b5366fc1e7686f8d4b60fce52baac6342
          python -m pip install -e '.[dev,cloud]' build twine
          python -m pytest -q
          python -m build
          python -m twine check dist/*
          python - <<'PYCODE'
          import tomllib
          from pathlib import Path
          assert tomllib.loads(Path('pyproject.toml').read_text())['project']['version'] == '2.10.1'
          PYCODE
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.NEXUS_PYPI_2101 }}
        run: python -m twine upload --disable-progress-bar dist/*
