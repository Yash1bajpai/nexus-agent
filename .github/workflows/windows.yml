name: Windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all,web]"
      - name: Tests
        shell: pwsh
        run: python -m pytest tests/ -v --tb=short
      - name: Entry points and doctor
        shell: pwsh
        run: |
          nexus-agent --version
          python -m nexus_agent_ai --version
          nexus-agent doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
      - name: Windows smoke checks (ACL, session ids, CRLF patching, spaces/unicode paths)
        shell: pwsh
        run: python scripts/windows_smoke.py

  wheel-install:
    # What a new user does: only Python present, plain pip install of the built wheel, no extras.
    # --only-binary :all: proves nothing needs a compiler. Not the same as the editable-install job above.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Clean venv install, binary wheels only
        shell: pwsh
        run: |
          python -m venv $env:RUNNER_TEMP\clean
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          & $env:RUNNER_TEMP\clean\Scripts\python.exe -m pip install --only-binary :all: $wheel
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          & $env:RUNNER_TEMP\clean\Scripts\python.exe -m pip list
      - name: Command works and no PyYAML pulled in
        shell: pwsh
        run: |
          $env:Path = "$env:RUNNER_TEMP\clean\Scripts;$env:Path"
          nexus-agent-ai --version
          if ($LASTEXITCODE -ne 0) { throw "nexus-agent-ai failed" }
          nexus-agent-ai doctor --no-network
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
          $pl = & $env:RUNNER_TEMP\clean\Scripts\python.exe -m pip list
          if ($pl -match "(?i)pyyaml|huggingface") { throw "unexpected dependency present" }

  first-run:
    # Real model download + chat. Slow (the runner measured ~1 MB/s from Hugging Face), so manual only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      NEXUS_AGENT_MODEL_REPO: LiquidAI/LFM2.5-1.2B-Instruct-GGUF
      NEXUS_AGENT_MODEL_FILENAME: LFM2.5-1.2B-Instruct-Q4_0.gguf
      NEXUS_AGENT_ASSUME_YES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        id: install
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $logs = "$env:RUNNER_TEMP\nexus-first-run"
          New-Item -ItemType Directory -Force $logs | Out-Null
          python -m pip install -e ".[dev,all,web]" 2>&1 | Tee-Object -FilePath "$logs\install.log"
          $installExit = $LASTEXITCODE
          "Install exit code: $installExit" | Tee-Object -FilePath "$logs\install.log" -Append
          if ($installExit -ne 0) { throw "pip install failed with exit code $installExit" }
          Get-Command nexus-agent -CommandType Application -ErrorAction Stop | Out-Null
          nexus-agent --version 2>&1 | Tee-Object -FilePath "$logs\install.log" -Append
          $versionExit = $LASTEXITCODE
          if ($versionExit -ne 0) { throw "nexus-agent cannot start (exit code $versionExit)" }
      - name: First run with small model and one chat
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $work = "$env:RUNNER_TEMP\nexus-first-run\smoke"
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          nexus-agent chat -p local "say hi in five words" 2>&1 | Tee-Object -FilePath chat.log
          $chatExit = $LASTEXITCODE
          "Chat exit code: $chatExit" | Tee-Object -FilePath status.log
          if ($chatExit -ne 0) { throw "chat failed with exit code $chatExit" }
      - name: S1 - tool arithmetic returns the exact result
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $work = "$env:RUNNER_TEMP\nexus-first-run\s1"
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          Get-Command nexus-agent -CommandType Application -ErrorAction Stop | Out-Null
          nexus-agent chat -p local --verbose 'What is 48291 * 259? Use a tool.' 2>&1 | Tee-Object -FilePath chat.log
          $chatExit = $LASTEXITCODE
          "S1 exit code: $chatExit" | Tee-Object -FilePath status.log
          if ($chatExit -ne 0) { throw "S1 failed with exit code $chatExit" }
          if ((Get-Content chat.log -Raw) -notmatch '(?<!\d)12507369(?!\d)') {
            throw "S1 did not log the exact expected result 12507369"
          }
          "S1: PASS (exit 0, exact result 12507369)" | Tee-Object -FilePath status.log -Append
          Get-Content status.log | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: S2 - real file edit or an honest agent failure
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $work = "$env:RUNNER_TEMP\nexus-first-run\s2"
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          Set-Content s2target.py 'x = 1'
          Get-Command nexus-agent -CommandType Application -ErrorAction Stop | Out-Null
          nexus-agent chat -p local 'Change x to 2 in s2target.py' 2>&1 | Tee-Object -FilePath chat.log
          $chatExit = $LASTEXITCODE
          "S2 exit code: $chatExit" | Tee-Object -FilePath status.log
          if (Test-Path s2target.py) {
            "s2target.py after the command:" | Tee-Object -FilePath status.log -Append
            Get-Content s2target.py | Tee-Object -FilePath status.log -Append
          } else {
            "s2target.py is missing after the command" | Tee-Object -FilePath status.log -Append
          }
          # Parsing assignments rejects a comment/string containing 'x = 2'.
          python -c "import ast, pathlib, sys; p = pathlib.Path('s2target.py'); tree = ast.parse(p.read_text(encoding='utf-8-sig')) if p.is_file() else ast.Module(body=[], type_ignores=[]); edited = any(isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'x' for t in n.targets) and isinstance(n.value, ast.Constant) and type(n.value.value) is int and n.value.value == 2 for n in tree.body); print('AST assignment x = 2:', edited); sys.exit(0 if edited else 1)" 2>&1 | Tee-Object -FilePath status.log -Append
          $fileCheckExit = $LASTEXITCODE
          $output = (Get-Content chat.log -Raw) -replace '\x1b\[[0-?]*[ -/]*[@-~]', ''
          if ($chatExit -eq 0) {
            if ($fileCheckExit -ne 0) { throw "S2 falsely reported success without an x = 2 assignment" }
            $result = 'S2: PASS - EDITED (exit 0 and AST-confirmed x = 2)'
          } else {
            # A completed CLI footer + reported agent error distinguishes an honest
            # outcome from missing commands, launcher/import failures and fatal startup.
            if ($chatExit -ne 1 -or $output -notmatch '(?s)Tokens:.*Time:' -or
                $output -notmatch '\[ERROR\]' -or $output -match 'Fatal execution error:') {
              throw "S2 failed to run normally; exit $chatExit is not an honest agent outcome"
            }
            $result = "S2: PASS - HONEST FAILURE (agent exit $chatExit; AST check exit $fileCheckExit; not accepted as completed)"
            Write-Warning $result
          }
          $result | Tee-Object -FilePath status.log -Append
          Get-Content status.log | Add-Content $env:GITHUB_STEP_SUMMARY
          # GitHub's pwsh wrapper checks LASTEXITCODE even after a handled failure.
          $global:LASTEXITCODE = 0
      - name: S3 - current Python release with a retrieved source URL
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $work = "$env:RUNNER_TEMP\nexus-first-run\s3"
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          Get-Command nexus-agent -CommandType Application -ErrorAction Stop | Out-Null
          nexus-agent chat -p local --verbose 'What is the latest stable Python version? Search the web.' 2>&1 | Tee-Object -FilePath chat.log
          $chatExit = $LASTEXITCODE
          "S3 exit code: $chatExit" | Tee-Object -FilePath status.log
          if ($chatExit -ne 0) { throw "S3 failed with exit code $chatExit" }
          $output = (Get-Content chat.log -Raw) -replace '\x1b\[[0-?]*[ -/]*[@-~]', ''
          # Only inspect output following an observed search, not model-download
          # URLs or the local inference server's readiness/health URL.
          $search = [regex]::Match($output, '(?s)\[ACTION\]\s+search_web\b.*?\[OBSERVE\](?<retrieval>.*)')
          if (-not $search.Success) { throw "S3 did not log an observed web search" }
          $sources = @(
            foreach ($match in [regex]::Matches($search.Groups['retrieval'].Value, 'https?://[^\s<>"''|]+')) {
              $uri = $null
              $candidate = $match.Value.TrimEnd([char[]]').,]')
              if ([Uri]::TryCreate($candidate, [UriKind]::Absolute, [ref]$uri) -and
                  -not $uri.IsLoopback -and $uri.HostNameType -eq [UriHostNameType]::Dns -and
                  $uri.Host.Contains('.') -and $uri.Host -notmatch '\.(localhost|local|invalid|test|example)$') {
                $candidate
              }
            }
          )
          if ($sources.Count -eq 0) { throw "S3 did not log an external HTTP(S) source URL after searching" }
          "S3: PASS (exit 0, observed search, external source URL; no fixed version asserted)" | Tee-Object -FilePath status.log -Append
          $sources | Tee-Object -FilePath status.log -Append
          Get-Content status.log | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload first-run logs and qualification file state
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-first-run-qualification
          path: ${{ runner.temp }}/nexus-first-run/
          if-no-files-found: warn

  permission-prompt-conpty:
    # Real Windows pseudo-console. Scratch folder, throwaway home, answers typed by the script.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and install it into a clean venv
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv $env:RUNNER_TEMP\clean
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          & $env:RUNNER_TEMP\clean\Scripts\python.exe -m pip install --only-binary :all: $wheel pywinpty
      - name: Permission prompt through ConPTY
        shell: pwsh
        run: |
          & $env:RUNNER_TEMP\clean\Scripts\python.exe ci\pty_consent_windows.py $env:RUNNER_TEMP\clean\Scripts\python.exe
          if ($LASTEXITCODE -ne 0) { throw "ConPTY permission flow failed" }

  user-install-path:
    # What a plain `pip install --user` leaves behind: is the bare command found, and does the fallback work?
    # Reports the real result; PATH is not edited to make it pass.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with --user and look for the command
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          python -m pip install --user --only-binary :all: $wheel
          $userScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts','nt_user'))"
          Write-Host "user Scripts folder: $userScripts"
          Write-Host ("script exists there: " + (Test-Path "$userScripts\nexus-agent-ai.exe"))
          $onPath = ($env:PATH -split ';') -contains $userScripts
          Write-Host "user Scripts folder on PATH: $onPath"
          Write-Host ("Get-Command nexus-agent-ai: " + [bool](Get-Command nexus-agent-ai -ErrorAction SilentlyContinue))
          python -m nexus_agent_ai --version
          if ($LASTEXITCODE -ne 0) { throw "python -m nexus_agent_ai failed" }
          python -m nexus_agent_ai doctor --no-network | Select-String "Command"
      - name: Same install with the user Scripts folder NOT on PATH (python.org style)
        shell: pwsh
        run: |
          $userScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts','nt_user'))"
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_.TrimEnd('\') -ne $userScripts.TrimEnd('\') }) -join ';'
          $found = [bool](Get-Command nexus-agent-ai -ErrorAction SilentlyContinue)
          Write-Host "bare command found with folder removed from PATH: $found"
          if ($found) { throw "expected the bare command to be missing in this simulation" }
          python -m nexus_agent_ai --version
          if ($LASTEXITCODE -ne 0) { throw "python -m nexus_agent_ai failed" }
          $out = python -m nexus_agent_ai doctor --no-network | Out-String
          Write-Host $out
          if ($out -notmatch [regex]::Escape($userScripts)) { throw "doctor did not name the Scripts folder" }
          if ($out -notmatch "python -m nexus_agent_ai") { throw "doctor did not give the python -m fallback" }
      - name: setup-path adds the folder to the USER PATH when asked, and a fresh terminal then finds the bare command
        shell: pwsh
        run: |
          $userScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts','nt_user'))"
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_.TrimEnd('\') -ne $userScripts.TrimEnd('\') }) -join ';'
          python -m nexus_agent_ai setup-path --yes
          if ($LASTEXITCODE -ne 0) { throw "setup-path failed" }
          $user = [Environment]::GetEnvironmentVariable('Path','User')
          Write-Host "user PATH now contains the folder: $(($user -split ';') -contains $userScripts)"
          if (-not (($user -split ';') -contains $userScripts)) { throw "user PATH not updated" }
          # what a NEW terminal would see: machine PATH + user PATH from the registry
          $env:PATH = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + $user
          $cmd = Get-Command nexus-agent-ai -ErrorAction SilentlyContinue
          Write-Host "fresh-terminal Get-Command: $([bool]$cmd)"
          if (-not $cmd) { throw "bare command still not found after setup-path" }
          nexus-agent-ai --version
          if ($LASTEXITCODE -ne 0) { throw "bare nexus-agent-ai failed" }
          # idempotent: second run adds nothing
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_.TrimEnd('\') -ne $userScripts.TrimEnd('\') }) -join ';'
          python -m nexus_agent_ai setup-path --yes
          $count = (([Environment]::GetEnvironmentVariable('Path','User')) -split ';' | Where-Object { $_.TrimEnd('\') -eq $userScripts.TrimEnd('\') }).Count
          Write-Host "entries for the folder after a second run: $count"
          if ($count -ne 1) { throw "duplicate PATH entry" }

  isolated-profile:
    # A brand-new-user simulation: new venv + a brand-new, empty USER PROFILE folder (USERPROFILE override).
    # Proves config, keys, first-run flag, models and engine all land in the override and the real profile is untouched.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Fresh venv plus fresh profile
        shell: pwsh
        run: |
          $real = $env:USERPROFILE
          python -m venv "$env:RUNNER_TEMP\nx-venv"
          & "$env:RUNNER_TEMP\nx-venv\Scripts\python.exe" -m pip install --only-binary :all: (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          $fake = "$env:RUNNER_TEMP\nexus-test-home"
          New-Item -ItemType Directory $fake | Out-Null
          $env:USERPROFILE = $fake
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          Remove-Item Env:HOMEDRIVE -ErrorAction SilentlyContinue
          Remove-Item Env:HOMEPATH -ErrorAction SilentlyContinue
          & "$env:RUNNER_TEMP\nx-venv\Scripts\python.exe" ci\profile_isolation.py $real $fake
          if ($LASTEXITCODE -ne 0) { throw "profile isolation failed" }
          & "$env:RUNNER_TEMP\nx-venv\Scripts\nexus-agent-ai.exe" doctor --no-network
          Write-Host "files in the fresh profile:"; Get-ChildItem -Force -Recurse $fake | Select-Object -First 20 FullName
          # direct venv executable (no Activate.ps1, no execution-policy dependency) works, and the venv never triggers a PATH edit
          & "$env:RUNNER_TEMP\nx-venv\Scripts\nexus-agent-ai.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "direct venv executable failed" }
          $userPathBefore = [Environment]::GetEnvironmentVariable('Path','User')
          $offer = & "$env:RUNNER_TEMP\nx-venv\Scripts\python.exe" -c "from nexus_agent_ai.utils import pathfix; print(pathfix.folder_missing_from_path())"
          Write-Host "PATH offer inside venv: $offer"
          if ($offer -ne "None") { throw "venv should never be offered a PATH edit" }
          if ([Environment]::GetEnvironmentVariable('Path','User') -ne $userPathBefore) { throw "user PATH changed" }
