name: Windows

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all,web]"
      - name: Tests
        shell: pwsh
        run: python -m pytest tests/ -v --tb=short
      - name: Entry points and doctor
        shell: pwsh
        run: |
          nexus-agent --version
          python -m nexus_agent_ai --version
          nexus-agent doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
      - name: Windows smoke checks (ACL, session ids, CRLF patching, spaces/unicode paths)
        shell: pwsh
        run: python scripts/windows_smoke.py

  wheel-install:
    # What a new user does: only Python present, plain pip install of the built wheel, no extras.
    # --only-binary :all: proves nothing needs a compiler. Not the same as the editable-install job above.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Clean venv install, binary wheels only
        shell: pwsh
        run: |
          python -m venv $env:RUNNER_TEMP\clean
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          & $env:RUNNER_TEMP\clean\Scripts\python.exe -m pip install --only-binary :all: $wheel
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          & $env:RUNNER_TEMP\clean\Scripts\python.exe -m pip list
      - name: Command works and no PyYAML pulled in
        shell: pwsh
        run: |
          $env:Path = "$env:RUNNER_TEMP\clean\Scripts;$env:Path"
          nexus-agent-ai --version
          if ($LASTEXITCODE -ne 0) { throw "nexus-agent-ai failed" }
          nexus-agent-ai doctor --no-network
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
          $pl = & $env:RUNNER_TEMP\clean\Scripts\python.exe -m pip list
          if ($pl -match "(?i)pyyaml|huggingface") { throw "unexpected dependency present" }

  first-run:
    # Real model download + chat. Slow (the runner measured ~1 MB/s from Hugging Face), so manual only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: python -m pip install -e ".[dev,all,web]"
      - name: First run with small model and one chat
        shell: pwsh
        env:
          NEXUS_AGENT_MODEL_REPO: LiquidAI/LFM2.5-1.2B-Instruct-GGUF
          NEXUS_AGENT_MODEL_FILENAME: LFM2.5-1.2B-Instruct-Q4_0.gguf
          NEXUS_AGENT_ASSUME_YES: "1"
        run: |
          nexus-agent chat -p local "say hi in five words" 2>&1 | Tee-Object -FilePath chat.log
          if ($LASTEXITCODE -ne 0) { throw "chat failed with exit code $LASTEXITCODE" }
          if ((Get-Content chat.log -Raw).Trim().Length -lt 3) { throw "empty chat output" }

  permission-prompt-conpty:
    # Real Windows pseudo-console. Scratch folder, throwaway home, answers typed by the script.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and install it into a clean venv
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv $env:RUNNER_TEMP\clean
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          & $env:RUNNER_TEMP\clean\Scripts\python.exe -m pip install --only-binary :all: $wheel pywinpty
      - name: Permission prompt through ConPTY
        shell: pwsh
        run: |
          & $env:RUNNER_TEMP\clean\Scripts\python.exe ci\pty_consent_windows.py $env:RUNNER_TEMP\clean\Scripts\python.exe
          if ($LASTEXITCODE -ne 0) { throw "ConPTY permission flow failed" }

  user-install-path:
    # What a plain `pip install --user` leaves behind: is the bare command found, and does the fallback work?
    # Reports the real result; PATH is not edited to make it pass.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with --user and look for the command
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          python -m pip install --user --only-binary :all: $wheel
          $userScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts','nt_user'))"
          Write-Host "user Scripts folder: $userScripts"
          Write-Host ("script exists there: " + (Test-Path "$userScripts\nexus-agent-ai.exe"))
          $onPath = ($env:PATH -split ';') -contains $userScripts
          Write-Host "user Scripts folder on PATH: $onPath"
          Write-Host ("Get-Command nexus-agent-ai: " + [bool](Get-Command nexus-agent-ai -ErrorAction SilentlyContinue))
          python -m nexus_agent_ai --version
          if ($LASTEXITCODE -ne 0) { throw "python -m nexus_agent_ai failed" }
          python -m nexus_agent_ai doctor --no-network | Select-String "Command"
      - name: Same install with the user Scripts folder NOT on PATH (python.org style)
        shell: pwsh
        run: |
          $userScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts','nt_user'))"
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_.TrimEnd('\') -ne $userScripts.TrimEnd('\') }) -join ';'
          $found = [bool](Get-Command nexus-agent-ai -ErrorAction SilentlyContinue)
          Write-Host "bare command found with folder removed from PATH: $found"
          if ($found) { throw "expected the bare command to be missing in this simulation" }
          python -m nexus_agent_ai --version
          if ($LASTEXITCODE -ne 0) { throw "python -m nexus_agent_ai failed" }
          $out = python -m nexus_agent_ai doctor --no-network | Out-String
          Write-Host $out
          if ($out -notmatch [regex]::Escape($userScripts)) { throw "doctor did not name the Scripts folder" }
          if ($out -notmatch "python -m nexus_agent_ai") { throw "doctor did not give the python -m fallback" }
