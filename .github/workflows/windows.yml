          New-Item -ItemType Directory -Force "$isoHome\AppData\Roaming" | Out-Null
          New-Item -ItemType Directory -Force "$isoHome\AppData\Local" | Out-Null

          "USERPROFILE=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APPDATA=$isoHome\AppData\Roaming" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALAPPDATA=$isoHome\AppData\Local" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONUNBUFFERED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONIOENCODING=utf-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_AGENT_MODEL_REPO=LiquidAI/LFM2.5-8B-A1B-GGUF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_AGENT_MODEL_FILENAME=LFM2.5-8B-A1B-Q4_K_M.gguf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_AGENT_ASSUME_YES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $env:USERPROFILE = $isoHome
          $env:HOME = $isoHome
          $env:APPDATA = "$isoHome\AppData\Roaming"
          $env:LOCALAPPDATA = "$isoHome\AppData\Local"
          $env:PYTHONPATH = ""

          Write-Host "Isolated profile initialized under $isoHome"
          $rc = $LASTEXITCODE; if ($null -eq $rc) { $rc = 0 }
          Write-Host "Raw Exit Code (init): $rc"
          if ($rc -ne 0) { throw "init failed with exit code $rc" }

      # -----------------------------------------------------------------------
      # 2. Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 3. Setup Python 3.12
      # -----------------------------------------------------------------------
      - name: Setup Python 3.12
        id: setup_python
        timeout-minutes: 2
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # 4. Verify source provenance and build single wheel
      # -----------------------------------------------------------------------
      - name: Build wheel from exact source
        id: build_wheel
        timeout-minutes: 3
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          # Record exact Git provenance to console
          $gitHeadRaw = git rev-parse HEAD
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (git rev-parse HEAD): $rc"
          if ($rc -ne 0) { throw "git rev-parse HEAD failed with exit code $rc" }
          $gitHead = [string]::Join("`n", @($gitHeadRaw)).Trim()
          Write-Host "Git HEAD Commit: $gitHead"

          $gitTreeRaw = git rev-parse 'HEAD^{tree}'
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (git rev-parse tree): $rc"
          if ($rc -ne 0) { throw "git rev-parse tree failed with exit code $rc" }
          $gitTree = [string]::Join("`n", @($gitTreeRaw)).Trim()
          Write-Host "Git Tree: $gitTree"

          $gitStatusRaw = git status --porcelain
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (git status --porcelain): $rc"
          if ($rc -ne 0) { throw "git status failed with exit code $rc" }
          $gitStatus = [string]::Join("`n", @($gitStatusRaw)).Trim()
          Write-Host "Git Status Porcelain: $gitStatus"
          if ($gitStatus) { throw "Dirty tracked/untracked worktree is not an exact committed source run" }

          # Verify accepted source tools.py SHA256 before building
          $sourceTools = "src\nexus_agent_ai\agent\tools.py"
          if (-not (Test-Path $sourceTools)) { throw "Source file '$sourceTools' missing" }
          $sourceToolsHash = (Get-FileHash -Algorithm SHA256 $sourceTools).Hash.ToLower()
          Write-Host "Source tools.py SHA256: $sourceToolsHash"
          $expectedToolsHash = "eb40f8aae3cad7c49d593cfea9a5bbd1ccebd0d13a2734177f1865a11f320e78"
          if ($sourceToolsHash -ne $expectedToolsHash) {
            throw "Source tools.py SHA256 ($sourceToolsHash) does not match accepted hash ($expectedToolsHash)"
          }

          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          python -m pip install --upgrade pip build
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip install build): $rc"
          if ($rc -ne 0) { throw "pip install build failed with exit code $rc" }

          python -m build --wheel
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (python -m build --wheel): $rc"
          if ($rc -ne 0) { throw "build wheel failed with exit code $rc" }

          $wheels = Get-ChildItem dist\*.whl
          if ($wheels.Count -ne 1) { throw "Expected exactly 1 wheel in dist/, found $($wheels.Count)" }
          $wheelPath = $wheels[0].FullName
          $wheelHash = (Get-FileHash -Algorithm SHA256 $wheelPath).Hash.ToLower()
          Write-Host "Built Wheel: $wheelPath"
          Write-Host "Wheel SHA256: $wheelHash"

      # -----------------------------------------------------------------------
      # 5. Install wheel into clean isolated virtual environment
      # -----------------------------------------------------------------------
      - name: Install wheel into isolated venv
        id: install_wheel
        timeout-minutes: 3
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $venvDir = "$env:RUNNER_TEMP\nx-obs-venv"
          python -m venv $venvDir
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (python -m venv): $rc"
          if ($rc -ne 0) { throw "venv creation failed with exit code $rc" }

          $venvPython = "$venvDir\Scripts\python.exe"
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName

          & $venvPython -m pip install --only-binary :all: $wheel
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip install wheel): $rc"
          if ($rc -ne 0) { throw "pip install wheel failed with exit code $rc" }

          & $venvPython -m pip install --only-binary :all: psutil
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip install psutil): $rc"
          if ($rc -ne 0) { throw "pip install psutil failed with exit code $rc" }

          Write-Host "Installed venv packages:"
          & $venvPython -m pip list
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pip list): $rc"
          if ($rc -ne 0) { throw "pip list failed with exit code $rc" }

      # -----------------------------------------------------------------------
      # 6. Verify installed package identity and sysconfig purelib path
      # -----------------------------------------------------------------------
      - name: Verify installed tools.py identity
        id: verify_identity
        timeout-minutes: 1
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $venvPython = "$env:RUNNER_TEMP\nx-obs-venv\Scripts\python.exe"

          $verifyScript = @"
          import hashlib, pathlib, sys, sysconfig
          import nexus_agent_ai.agent.tools as t

          tools_path = pathlib.Path(t.__file__).resolve()
          purelib = pathlib.Path(sysconfig.get_path('purelib')).resolve()
          print(f"Purelib Path: {purelib}")
          print(f"Installed Tools Path: {tools_path}")

          assert tools_path.is_relative_to(purelib), f"tools.py ({tools_path}) is not under purelib ({purelib})"

          installed_hash = hashlib.sha256(tools_path.read_bytes()).hexdigest().lower()
          print(f"Installed tools.py SHA256: {installed_hash}")
          expected_hash = "eb40f8aae3cad7c49d593cfea9a5bbd1ccebd0d13a2734177f1865a11f320e78"
          assert installed_hash == expected_hash, f"Hash mismatch: got {installed_hash}, expected {expected_hash}"
          print("Installed tools.py identity and hash MATCH eb40f8aa")
          "@

          & $venvPython -c $verifyScript
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (verify_identity): $rc"
          if ($rc -ne 0) { throw "verify_identity failed with exit code $rc" }

      # -----------------------------------------------------------------------
      # 7. Pull model weights & llama-server engine (bounded time)
      # -----------------------------------------------------------------------
      - name: Pull model weights and engine
        id: pull_model
        timeout-minutes: 12
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $venvScripts = "$env:RUNNER_TEMP\nx-obs-venv\Scripts"

          & "$venvScripts\nexus-agent.exe" pull-model `
            --repo $env:NEXUS_AGENT_MODEL_REPO `
            --file $env:NEXUS_AGENT_MODEL_FILENAME

          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (pull-model): $rc"
          if ($rc -ne 0) { throw "pull-model failed with exit code $rc" }

      # -----------------------------------------------------------------------
      # 8. Run two-turn normal-prompt observation driver
      # -----------------------------------------------------------------------
      - name: Observe normal two-turn CLI chat (5 independent iterations)
        id: observe_turns
        timeout-minutes: 33
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $venvDir = "$env:RUNNER_TEMP\nx-obs-venv"
          $venvPython = "$venvDir\Scripts\python.exe"
          $cliExe = "$venvDir\Scripts\nexus-agent.exe"

          # TEST1: 5 bounded iterations, each fully independent: fresh scratch
          # workspace (observer rewrites calc.py) AND fresh session id (product
          # history is keyed by session in ~/.nexus-agent/history.db), so no
          # conversational/history carryover. Model file reused from the job's
          # isolated HOME (single download). Observer is graceful on turn
          # failure; per-iteration evidence + RC are recorded, no throw here.
          $applied = 0
          $completed = 0
          for ($k = 1; $k -le 5; $k++) {
            Write-Host "=================== ITERATION $k START ==================="
            $ws = "$env:RUNNER_TEMP\obs8b_workspace_k$k"
            $ev = "$env:RUNNER_TEMP\obs8b_evidence_k$k"
            $sess = "obs8b-session-k$k"

            & $venvPython ci/observe_normal_turns.py `
              --workspace $ws `
              --evidence-dir $ev `
              --cli-exe $cliExe `
              --session-id $sess
            $rc = $LASTEXITCODE
            $completed++
            Write-Host "Raw Exit Code (observe_normal_turns iteration $k): $rc"

            # Bounded applied-evidence proxy (reviewer judges PASS from raw
            # streams): RC0 + snapshot changed in BOTH turns + final calc.py
            # contains a multiply operator.
            $h0 = (Get-FileHash "$ev\calc_initial.py" -ErrorAction SilentlyContinue).Hash
            $h1 = (Get-FileHash "$ev\calc_after_turn1.py" -ErrorAction SilentlyContinue).Hash
            $h2 = (Get-FileHash "$ev\calc_after_turn2.py" -ErrorAction SilentlyContinue).Hash
            $final = Get-Content "$ev\calc_after_turn2.py" -Raw -ErrorAction SilentlyContinue
            $hasMul = ($null -ne $final) -and ($final -match "\*")
            $iterApplied = ($rc -eq 0) -and ($null -ne $h0) -and ($null -ne $h1) -and ($null -ne $h2) -and ($h1 -ne $h0) -and ($h2 -ne $h1) -and $hasMul
            if ($iterApplied) { $applied++ }
            Write-Host "ITERATION $k APPLIED-EVIDENCE: $iterApplied (rc=$rc, mul=$hasMul)"
            Write-Host "==================== ITERATION $k END ===================="
          }
          Write-Host "TEST1 ITERATIONS COMPLETED: $completed/5"
          Write-Host "TEST1 ITERATIONS APPLIED-RC0: $applied/5 (hash+content proxy; reviewer judges from raw per-turn streams)"
          $rc = $LASTEXITCODE; if ($null -eq $rc) { $rc = 0 }
          Write-Host "Raw Exit Code (observe loop): $rc"

      - name: Publish step summary
        id: summary
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $anyFound = $false
          for ($k = 1; $k -le 5; $k++) {
            $summaryFile = "$env:RUNNER_TEMP\obs8b_evidence_k$k\summary.md"
            if (Test-Path $summaryFile) {
              "## ITERATION $k" | Add-Content $env:GITHUB_STEP_SUMMARY
              Get-Content $summaryFile | Add-Content $env:GITHUB_STEP_SUMMARY
              $anyFound = $true
            }
          }
          if (-not $anyFound) {
            $md = @(
              "# Nexus Normal Observation Summary",
              "",
              "- **Execution Status:** INCOMPLETE (Runner terminated before summary generation)",
              "- **Model Qualification:** UNVERIFIED"
            ) -join "`n"
            $md | Add-Content $env:GITHUB_STEP_SUMMARY
          }

  # -------------------------------------------------------------------------
  # TEST 0 (raw engine smoke) for the high-spec tier evaluation, appended as a
  # second job on this experimental ref only. Reviewed candidate; runs only on
  # manual dispatch. No artifacts/uploads/cache; raw evidence to console and
  # step summary. PASS criteria: parsed tool_calls with valid JSON args, no
  # special-token or thinking leaks in content. FAIL prints raw bytes.
  # -------------------------------------------------------------------------
  test0-engine-smoke:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------------
      # 1. Initialize isolated environment (runner context invalid in job env)
      # ---------------------------------------------------------------------
      - name: Initialize isolated environment
        id: init
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $isoHome = "$env:RUNNER_TEMP\isolated_home"
          New-Item -ItemType Directory -Force $isoHome | Out-Null

          "USERPROFILE=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$isoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONUNBUFFERED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONIOENCODING=utf-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MODEL_REPO=LiquidAI/LFM2.5-8B-A1B-GGUF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MODEL_FILE=LFM2.5-8B-A1B-Q4_K_M.gguf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SERVER_PORT=18080" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $env:USERPROFILE = $isoHome
          $env:HOME = $isoHome
          $env:PYTHONPATH = ""

          $drive = (Get-PSDrive -Name ($env:RUNNER_TEMP.Split(':')[0]))
          Write-Host ("Free disk on {0}: {1:N1} GB" -f $drive.Name, ($drive.Free/1GB))
          Write-Host "Isolated profile initialized under $isoHome"

      # ---------------------------------------------------------------------
      # 2. Checkout repository (tool schemas are extracted from exact source)
      # ---------------------------------------------------------------------
      - name: Checkout repository
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 3. Setup Python 3.12 (stdlib only: schema extraction + evaluation)
      # ---------------------------------------------------------------------
      - name: Setup Python 3.12
        id: setup_python
        timeout-minutes: 2
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------------
      # 4. Record provenance and write helper scripts
      # ---------------------------------------------------------------------
      - name: Record provenance and write helper scripts
        id: helpers
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $gitHead = ([string]::Join("`n", @(git rev-parse HEAD))).Trim()
          Write-Host "Git HEAD Commit: $gitHead"
          $gitTree = ([string]::Join("`n", @(git rev-parse 'HEAD^{tree}'))).Trim()
          Write-Host "Git Tree: $gitTree"
          $gitStatus = ([string]::Join("`n", @(git status --porcelain))).Trim()
          Write-Host "Git Status Porcelain: $gitStatus"
          if ($gitStatus) { throw "Dirty worktree is not an exact committed source run" }

          $toolsHash = (Get-FileHash -Algorithm SHA256 "src\nexus_agent_ai\agent\tools.py").Hash.ToLower()
          Write-Host "Checked-out tools.py SHA256: $toolsHash"

          $extractor = @'
          """Extract tool schemas from nexus_agent_ai/agent/tools.py without importing it.

          Emits exactly what LocalProvider._convert_tools emits:
          [{"type":"function","function":{"name","description","parameters"}}]
          Stdlib-only AST literal evaluation; no product code is executed.
          """
          import ast, json, sys

          ORDER = ["read_file", "write_file", "patch_file", "list_directory",
                   "run_code", "search_web", "git_status", "git_diff", "run_tests"]

          def main(path):
              tree = ast.parse(open(path, encoding="utf-8").read())
              found = {}
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign) and isinstance(node.value, ast.Call):
                      f = node.value.func
                      if (isinstance(f, ast.Name) and f.id == "Tool") or (isinstance(f, ast.Attribute) and f.attr == "Tool"):
                          kw = {k.arg: ast.literal_eval(k.value) for k in node.value.keywords
                                if k.arg in ("name", "description", "input_schema")}
                          if len(kw) == 3:
                              found[kw["name"]] = kw
              missing = [n for n in ORDER if n not in found]
              if missing:
                  raise SystemExit("MISSING TOOLS: " + ",".join(missing))
              payload = [{"type": "function", "function": {"name": n,
                          "description": found[n]["description"],
                          "parameters": found[n]["input_schema"]}} for n in ORDER]
              json.dump(payload, sys.stdout, indent=1)
              print()

          main(sys.argv[1])
          '@
          Set-Content -Path "$env:RUNNER_TEMP\extract_tools.py" -Value $extractor -Encoding utf8

          $builder = @'
          """Build the two raw request bodies for Test 0 from the extracted payload."""
          import json, sys

          tools = json.load(open(sys.argv[1], encoding="utf-8"))
          req_a = {
              "model": sys.argv[2],
              "messages": [{"role": "user", "content": "Hello, reply with a short friendly greeting."}],
              "max_tokens": 256,
              "stream": False,
          }
          req_b = {
              "model": sys.argv[2],
              "messages": [{"role": "user", "content": "Fix multiply in calc.py so it multiplies."}],
              "tools": tools,
              "max_tokens": 2048,
              "stream": False,
          }
          json.dump(req_a, open("req_a.json", "w", encoding="utf-8"))
          json.dump(req_b, open("req_b.json", "w", encoding="utf-8"))
          print("req_b tools:", [t["function"]["name"] for t in tools])
          '@
          Set-Content -Path "$env:RUNNER_TEMP\build_requests.py" -Value $builder -Encoding utf8

          $evaluator = @'
          """Test 0 verdict evaluator. Reads resp_a.json and resp_b.json raw bytes.

          PASS iff all of:
            A1. resp_a parses as JSON and has non-empty message content.
            B1. resp_b parses as JSON.
            B2. choices[0].message.tool_calls is a non-empty list.
            B3. every tool call name is one of the emitted schemas and its
                function.arguments string parses as a JSON object.
            B4. message content contains no "<|tool_call" and no "<|im_" leak.
            B5. message content contains no "<think" leak (thinking confined to
                reasoning_content or absent).
          FAIL otherwise; raw bytes are the evidence.
          """
          import json, sys

          failures = []

          raw_a = open("resp_a.json", "rb").read()
          raw_b = open("resp_b.json", "rb").read()
          print("=== RAW RESPONSE A BYTES ===")
          sys.stdout.write(raw_a.decode("utf-8", errors="replace")[:20000])
          print("\n=== RAW RESPONSE B BYTES ===")
          sys.stdout.write(raw_b.decode("utf-8", errors="replace")[:20000])
          print("\n=== END RAW BYTES ===")

          try:
              a = json.loads(raw_a)
              content_a = (a["choices"][0]["message"].get("content") or "").strip()
              if not content_a:
                  failures.append("A1: greeting response has empty content")
          except Exception as e:
              failures.append(f"A1: resp_a JSON parse/content failed: {e}")

          tool_names = set()
          try:
              tool_names = {t["function"]["name"] for t in json.load(open("tools-payload.json", encoding="utf-8"))}
          except Exception as e:
              failures.append(f"B0: tools payload unreadable: {e}")

          try:
              b = json.loads(raw_b)
          except Exception as e:
              failures.append(f"B1: resp_b JSON parse failed: {e}")
              b = None

          if b is not None:
              try:
                  msg = b["choices"][0]["message"]
              except Exception as e:
                  failures.append(f"B1: resp_b missing choices[0].message: {e}")
                  msg = {}
              tcs = msg.get("tool_calls")
              if not tcs or not isinstance(tcs, list):
                  failures.append("B2: no parsed tool_calls in response")
              else:
                  for i, tc in enumerate(tcs):
                      fn = (tc or {}).get("function") or {}
                      name = fn.get("name")
                      if name not in tool_names:
                          failures.append(f"B3: tool_calls[{i}] name {name!r} not in emitted schemas")
                      args = fn.get("arguments")
                      try:
                          parsed = json.loads(args) if isinstance(args, str) else args
                          if not isinstance(parsed, dict):
                              failures.append(f"B3: tool_calls[{i}] arguments not a JSON object")
                      except Exception as e:
                          failures.append(f"B3: tool_calls[{i}] arguments invalid JSON: {e}")
              content_b = msg.get("content") or ""
              if "<|tool_call" in content_b or "<|im_" in content_b:
                  failures.append("B4: special-token leak in message content")
              if "<think" in content_b:
                  failures.append("B5: thinking leaked into content (not confined to reasoning_content)")
              reasoning = msg.get("reasoning_content")
              print(f"reasoning_content present: {reasoning is not None}, length: {len(reasoning) if isinstance(reasoning, str) else 0}")
              print(f"finish_reason: {b['choices'][0].get('finish_reason')}")

          verdict = "PASS" if not failures else "FAIL"
          print(f"TEST0 VERDICT: {verdict}")
          for f in failures:
              print("FAIL-ITEM:", f)

          lines = [
              "# Nexus Test 0 LFM2.5-8B Engine Smoke Summary",
              "",
              f"- **Verdict:** {verdict}",
              "- **Model:** `LiquidAI/LFM2.5-8B-A1B-GGUF` / `LFM2.5-8B-A1B-Q4_K_M.gguf`",
              "- **Evidence:** raw response bytes printed to the job console above; no artifact uploads by design",
              "",
              "## Criteria",
          ]
          for f in failures:
              lines.append(f"- FAIL: {f}")
          if not failures:
              lines.append("- All PASS criteria met (A1, B1-B5); see console for raw bytes")
          open("summary.md", "w", encoding="utf-8").write("\n".join(lines) + "\n")
          sys.exit(0 if verdict == "PASS" else 1)
          '@
          Set-Content -Path "$env:RUNNER_TEMP\evaluate_test0.py" -Value $evaluator -Encoding utf8
          Write-Host "Helper scripts written"

      # ---------------------------------------------------------------------
      # 5. Extract exact tool payload from checked-out source
      # ---------------------------------------------------------------------
      - name: Extract exact tool payload
        id: tool_payload
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python "$env:RUNNER_TEMP\extract_tools.py" "src\nexus_agent_ai\agent\tools.py" | Out-File -FilePath tools-payload.json -Encoding utf8
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (extract_tools): $rc"
          if ($rc -ne 0) { throw "schema extraction failed with exit code $rc" }
          Write-Host "--- tools-payload.json (exact _convert_tools output) ---"
          Get-Content tools-payload.json

      # ---------------------------------------------------------------------
      # 6. Download and verify the pinned b7075 engine (fail-closed SHA256)
      # ---------------------------------------------------------------------
      - name: Download and verify llama-server b7075
        id: engine
        timeout-minutes: 5
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $zip = "$env:RUNNER_TEMP\llama-b7075-bin-win-cpu-x64.zip"
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/b7075/llama-b7075-bin-win-cpu-x64.zip"
          curl.exe -L --fail --silent --show-error -o $zip $url
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (engine download): $rc"
          if ($rc -ne 0) { throw "engine download failed with exit code $rc" }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Write-Host "Engine ZIP SHA256: $hash"
          $expected = "ee57177a13347b386e8c097908fbb7f37c814f8a9c2948aef64f843a93221f13"
          if ($hash -ne $expected) { throw "Engine SHA256 mismatch: got $hash expected $expected" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\llama-server" -Force
          $exe = Get-ChildItem -Recurse -Filter llama-server.exe "$env:RUNNER_TEMP\llama-server" | Select-Object -First 1
          if (-not $exe) { throw "llama-server.exe not found after extraction" }
          "ENGINE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Engine extracted: $($exe.FullName)"

      # ---------------------------------------------------------------------
      # 7. Download the 5.16 GB model; record SHA256 and download time
      # ---------------------------------------------------------------------
      - name: Download LFM2.5-8B-A1B Q4_K_M GGUF
        id: model
        timeout-minutes: 12
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $model = "$env:RUNNER_TEMP\$env:MODEL_FILE"
          $url = "https://huggingface.co/$env:MODEL_REPO/resolve/main/$env:MODEL_FILE"
          Write-Host "Downloading $url"
          $start = Get-Date
          curl.exe -L --fail --silent --show-error -o $model $url
          $rc = $LASTEXITCODE
          $elapsed = [int]((Get-Date) - $start).TotalSeconds
          Write-Host "Raw Exit Code (model download): $rc ; download_seconds=$elapsed"
          if ($rc -ne 0) { throw "model download failed with exit code $rc" }
          $size = (Get-Item $model).Length
          $hash = (Get-FileHash -Algorithm SHA256 $model).Hash.ToLower()
          Write-Host "MODEL_SIZE_BYTES=$size"
          Write-Host "MODEL_SHA256=$hash  (no pinned digest exists for model GGUFs; recorded for the review log)"
          "MODEL_PATH=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ---------------------------------------------------------------------
      # 8. Launch via exit-recording wrapper (D2); readiness; greeting in-step (D1)
      # ---------------------------------------------------------------------
      # ---------------------------------------------------------------------
      # 8-10 (S1 merged): launch + loaded-model readiness + requests + verdict
      # in ONE step - removes the cross-step process-lifetime boundary.
      # S2: readiness is GET /health until HTTP 200 (503 while loading), 300s
      # cap, every poll logged; curl --fail-with-body so HTTP error bodies
      # fail instead of passing. S3: wrapper exit diagnostics + D4 dumps kept.
      # ---------------------------------------------------------------------
      - name: Launch, readiness, requests, verdict (single combined step)
        id: smoke
        timeout-minutes: 25
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $logPath = "$env:RUNNER_TEMP\test0-server.log"
          $errPath = "$env:RUNNER_TEMP\test0-server.err.log"
          $pidFile = "$env:RUNNER_TEMP\server-pid.txt"
          $exitFile = "$env:RUNNER_TEMP\server-exit.txt"
          $wrapperPath = "$env:RUNNER_TEMP\server-wrapper.ps1"
          Remove-Item $pidFile,$exitFile -Force -ErrorAction SilentlyContinue

          # D2 (kept): wrapper records child PID at start, and exit code + UTC time when the server exits
          $wrapperLines = @(
            'param(',
            '  [string]$Exe,',
            '  [string]$LogOut,',
            '  [string]$LogErr,',
            '  [string]$PidFile,',
            '  [string]$ExitFile,',
            '  [string]$Port,',
            '  [string]$ModelPath',
            ')',
            '$srvArgs = @(',
            '  "-m", $ModelPath,',
            '  "--alias", "test0-lfm8b",',
            '  "-c", "4096",',
            '  "--parallel", "1",',
            '  "--port", $Port,',
            '  "--host", "127.0.0.1",',
            '  "-t", "4",',
            '  "--jinja",',
            '  "--temp", "0.1",',
            '  "--top-k", "50",',
            '  "--repeat-penalty", "1.1"',
            ')',
            '$p = Start-Process -FilePath $Exe -ArgumentList $srvArgs -RedirectStandardOutput $LogOut -RedirectStandardError $LogErr -PassThru -NoNewWindow',
            '"SERVER_PID=$($p.Id)" | Out-File -FilePath $PidFile -Encoding utf8',
            '$p.WaitForExit()',
            '"EXIT_CODE=$($p.ExitCode)" | Out-File -FilePath $ExitFile -Encoding utf8',
            '"EXIT_UTC=$((Get-Date).ToUniversalTime().ToString(''o''))" | Out-File -FilePath $ExitFile -Encoding utf8 -Append'
          )
          ($wrapperLines -join "`n") + "`n" | Out-File -FilePath $wrapperPath -Encoding utf8

          Write-Host "Launch (via wrapper, -NoNewWindow kept): $($env:ENGINE_EXE) -m $($env:MODEL_PATH) --alias test0-lfm8b -c 4096 --parallel 1 --port $($env:SERVER_PORT) --host 127.0.0.1 -t 4 --jinja --temp 0.1 --top-k 50 --repeat-penalty 1.1"
          $wproc = Start-Process -FilePath "pwsh" -ArgumentList @("-NoProfile","-ExecutionPolicy","Bypass","-File",$wrapperPath,"-Exe",$env:ENGINE_EXE,"-LogOut",$logPath,"-LogErr",$errPath,"-PidFile",$pidFile,"-ExitFile",$exitFile,"-Port",$env:SERVER_PORT,"-ModelPath",$env:MODEL_PATH) -PassThru -NoNewWindow
          Write-Host "wrapper PID: $($wproc.Id)"

          $pidDeadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $pidFile)) {
            if ((Get-Date) -gt $pidDeadline) { throw "wrapper did not write server-pid.txt within 60s" }
            Start-Sleep -Seconds 1
          }
          $serverPid = [int]((Get-Content $pidFile -Raw).Trim() -replace 'SERVER_PID=','')
          "SERVER_PID=$serverPid" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "llama-server PID: $serverPid"

          function Dump-Evidence {
            param([string]$phase)
            Write-Host "=== liveness evidence ($phase) ==="
            $alive = Get-Process -Id $serverPid -ErrorAction SilentlyContinue
            Write-Host ("server process {0}: {1}" -f $serverPid, $(if ($alive) {'ALIVE'} else {'DEAD'}))
            $conn = Get-NetTCPConnection -LocalPort ([int]$env:SERVER_PORT) -State Listen -ErrorAction SilentlyContinue
            Write-Host ("listener on {0}: {1}" -f $env:SERVER_PORT, $(if ($conn) {'LISTENING'} else {'NONE'}))
            Write-Host "--- server-exit.txt ---"
            if (Test-Path $exitFile) { Get-Content $exitFile } else { Write-Host "absent" }
            Write-Host "--- server log tail ---"
            if (Test-Path $logPath) { Get-Content $logPath -Tail 60 }
            Write-Host "--- server err tail ---"
            if (Test-Path $errPath) { Get-Content $errPath -Tail 60 }
          }

          # S2: loaded-model readiness - /health until HTTP 200, 300s cap, log each poll
          $deadline = (Get-Date).AddSeconds(300)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $exitFile) { Write-Host "server-exit.txt appeared during readiness"; break }
            $alive = Get-Process -Id $serverPid -ErrorAction SilentlyContinue
            if (-not $alive) { Write-Host "server process exited during readiness"; break }
            $code = curl.exe -s -o NUL -w '%{http_code}' "http://127.0.0.1:$env:SERVER_PORT/health"
            Write-Host ("readiness poll {0}: HTTP {1}" -f (Get-Date -Format o), $code)
            if ($code -eq "200") { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Dump-Evidence "readiness failure"
            throw "llama-server /health did not return HTTP 200 within 300s"
          }
          Write-Host "Server ready (/health HTTP 200)."
          Write-Host "--- server log head (version lines) ---"
          Get-Content $logPath -TotalCount 30

          python "$env:RUNNER_TEMP\build_requests.py" tools-payload.json "test0-lfm8b"
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (build_requests): $rc"
          if ($rc -ne 0) { throw "request build failed with exit code $rc" }
          Write-Host "--- req_b.json (full request body) ---"
          Get-Content req_b.json

          $base = "http://127.0.0.1:$env:SERVER_PORT/v1/chat/completions"
          Dump-Evidence "pre-request"

          curl.exe -s --fail-with-body -X POST -H "Content-Type: application/json" --data-binary "@req_a.json" -o resp_a.json $base
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (request A): $rc"
          if ($rc -ne 0) {
            Write-Host "--- resp_a.json (error body if any) ---"
            if (Test-Path resp_a.json) { Get-Content resp_a.json } else { Write-Host "absent" }
            Dump-Evidence "request A failure"
            throw "request A failed with exit code $rc"
          }
          Write-Host "resp_a bytes: $((Get-Item resp_a.json).Length)"
          Write-Host "--- resp_a.json (greeting raw response) ---"
          Get-Content resp_a.json

          curl.exe -s --fail-with-body -X POST -H "Content-Type: application/json" --data-binary "@req_b.json" -o resp_b.json $base
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (request B): $rc"
          if ($rc -ne 0) {
            Write-Host "--- resp_b.json (error body if any) ---"
            if (Test-Path resp_b.json) { Get-Content resp_b.json } else { Write-Host "absent" }
            Dump-Evidence "request B failure"
            throw "request B failed with exit code $rc"
          }
          Write-Host "resp_a bytes: $((Get-Item resp_a.json).Length) ; resp_b bytes: $((Get-Item resp_b.json).Length)"

          # S1: verdict in the same step
          python "$env:RUNNER_TEMP\evaluate_test0.py"
          $rc = $LASTEXITCODE; Write-Host "Raw Exit Code (evaluate_test0): $rc"
          if ($rc -ne 0) { throw "TEST 0 FAILED (see FAIL-ITEM lines and raw bytes above)" }

      # ---------------------------------------------------------------------
      # 11. Publish step summary
      # ---------------------------------------------------------------------
      - name: Publish step summary
        id: summary
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if (Test-Path summary.md) {
            Get-Content summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            @(
              "# Nexus Test 0 LFM2.5-8B Engine Smoke Summary",
              "",
              "- **Execution Status:** INCOMPLETE (terminated before verdict generation)",
              "- **Model Qualification:** UNVERIFIED"
            ) -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      # ---------------------------------------------------------------------
      # 12. Stop llama-server
      # ---------------------------------------------------------------------
      - name: Stop llama-server (D4 dump evidence first)
        id: cleanup
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Host "--- server log tail (cleanup) ---"
          if (Test-Path "$env:RUNNER_TEMP\test0-server.log") { Get-Content "$env:RUNNER_TEMP\test0-server.log" -Tail 60 } else { Write-Host "absent" }
          Write-Host "--- server err tail (cleanup) ---"
          if (Test-Path "$env:RUNNER_TEMP\test0-server.err.log") { Get-Content "$env:RUNNER_TEMP\test0-server.err.log" -Tail 60 } else { Write-Host "absent" }
          Write-Host "--- server-exit.txt (cleanup) ---"
          if (Test-Path "$env:RUNNER_TEMP\server-exit.txt") { Get-Content "$env:RUNNER_TEMP\server-exit.txt" } else { Write-Host "absent" }
          Get-Process -Name "llama-server" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Stopping llama-server PID $($_.Id)"
            Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
          }



