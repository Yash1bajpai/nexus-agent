name: Native file reader diagnostic (no model)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Initialize isolated profile
        id: init
        timeout-minutes: 1
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'reader-diagnostic-home'
          New-Item -ItemType Directory -Force $root | Out-Null
          "HOME=$root" | Add-Content $env:GITHUB_ENV
          "USERPROFILE=$root" | Add-Content $env:GITHUB_ENV
          "APPDATA=$root\AppData\Roaming" | Add-Content $env:GITHUB_ENV
          "LOCALAPPDATA=$root\AppData\Local" | Add-Content $env:GITHUB_ENV
          'PYTHONPATH=' | Add-Content $env:GITHUB_ENV
          'PYTHONUNBUFFERED=1' | Add-Content $env:GITHUB_ENV
      - name: Checkout experimental source
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        id: python
        timeout-minutes: 2
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run fixed reader fixtures, no model
        id: diagnostic
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $observerHash = (Get-FileHash ci/observe_normal_turns.py -Algorithm SHA256).Hash.ToLower()
          Write-Host "Observer source SHA256: $observerHash"
          if ($observerHash -ne 'e8e72487c119d2a1355f7560000af1cc697ef071bb8a9a054c5d54a2db8e937e') { throw 'Observer source changed' }
          python ci/reader_diagnostic.py
          $rc = $LASTEXITCODE
          Write-Host "Reader diagnostic raw exit code: $rc"
          if ($rc -ne 0) { throw "Reader diagnostic identified failures, raw exit $rc" }
      - name: Diagnostic status only
        if: always()
        timeout-minutes: 1
        shell: pwsh
        run: |
          $md = @(
            '# Native reader diagnostic (no model)',
            'Raw bounded stat tuples and fixed-fixture results are in console logs.',
            'No model, product commands, API keys, artifact uploads or cache writes.',
            'This is a reader diagnostic, not model qualification.',
            'init=${{ steps.init.outcome }}',
            'checkout=${{ steps.checkout.outcome }}',
            'python=${{ steps.python.outcome }}',
            'diagnostic=${{ steps.diagnostic.outcome }}'
          ) -join "`n"
          $md | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host $md
