name: Windows

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all,web]"
      - name: Tests
        shell: pwsh
        run: python -m pytest tests/ -v --tb=short
      - name: Entry points and doctor
        shell: pwsh
        run: |
          nexus-agent --version
          python -m nexus_agent_ai --version
          nexus-agent doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
      - name: Windows smoke checks (ACL, session ids, CRLF patching, spaces/unicode paths)
        shell: pwsh
        run: python scripts/windows_smoke.py
      - name: First run with small model and one chat
        shell: pwsh
        env:
          NEXUS_AGENT_MODEL_REPO: LiquidAI/LFM2.5-1.2B-Instruct-GGUF
          NEXUS_AGENT_MODEL_FILENAME: LFM2.5-1.2B-Instruct-Q4_0.gguf
          NEXUS_AGENT_ASSUME_YES: "1"
        run: |
          $out = nexus-agent chat -p local "say hi in five words" | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out.Trim().Length -lt 3) { throw "chat failed" }
          python -c "import os; from pathlib import Path; print(sorted(p.name for p in (Path.home()/'.cache'/'huggingface'/'hub').glob('models--*')))"
        timeout-minutes: 20
