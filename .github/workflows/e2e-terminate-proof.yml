# .github/workflows/e2e-terminate-proof.yml
# Nexus e2e — terminate_and_confirm P1-P3 proof + runner-envelope probes.
#
# Status: SOURCE PREPARED, NOT PUSHED, NOT DISPATCHED, NOT RUN.
# Authorization: Pushing this workflow to an experiment branch and dispatching it
# requires explicit owner authorization.
#
# Route truth:
#   Main branch carries NO e2e workflow. Dispatched exclusively on an isolated
#   experiment branch (pattern: experiment/terminate-confirm-proof-<date>).
#
# Envelope design:
#   - permissions: {} (scopeless GITHUB_TOKEN).
#   - persist-credentials: false on all checkouts; no repository secrets.
#   - probe-timeout: Demonstrates real runner step-timeout kill latency, checks
#     hazard process tree survivors (R1, R2, R4, C2, C9), and verifies timeout via
#     exact check_run_url suffix mapping (C3, C8) and full coverage (C4).
#   - probe-account: Demonstrates leftover account creation with atomic receipt
#     and unconditional post-sweep cleanup within a single VM lifecycle (R3, C7).
#   - proof-p1-p3: Gated on needs: [probe-timeout, probe-account]. Runs hash-verified
#     entrypoint with 15m step timeout under a 30m job reserve budget, followed
#     by an observed post-timeout cleanup and sweep step with if: always() (C1, C7).

name: terminate_and_confirm P1-P3 proof (narrow scope, not qualification)

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/terminate-confirm-proof-20261108-1233

permissions: {}

jobs:
  probe-timeout:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate probe nonce
        shell: powershell
        run: |
          $nonce = "probe_nonce_" + [System.Guid]::NewGuid().ToString("N")
          echo "PROBE_NONCE=$nonce" >> $env:GITHUB_ENV
          echo "Generated PROBE_NONCE: $nonce"

      - name: Deliberately stuck process (step timeout must kill it)
        id: stuck_step
        timeout-minutes: 2
        continue-on-error: true
        shell: powershell
        run: |
          python proof_runner_probe.py --mode timeout --nonce "$env:PROBE_NONCE" --log probe_timeout.log

      - name: Check process survivors in same VM
        if: always()
        shell: powershell
        run: |
          # Bounded 15s observational delay: survivors are intentionally left alive for this
          # window to distinguish in-flight runner handling from abandoned processes. This is
          # acceptable ONLY because this job runs on a disposable GitHub-hosted VM used for nothing else.
          # R-A: Tee-Object -FilePath writes UTF-16LE+BOM on Windows PowerShell 5.1, which the
          # pinned gate evaluator (utf-8, startswith) cannot parse. Capture via -Variable and
          # write BOM-less UTF-8 explicitly; preserve the probe's native exit code immediately.
          python proof_runner_probe.py --mode check-survivors --nonce "$env:PROBE_NONCE" --log probe_timeout.log | Tee-Object -Variable _survCapture
          $rc = $LASTEXITCODE
          [System.IO.File]::WriteAllLines("$PWD\survivor_check_step.log", [string[]]$_survCapture, (New-Object System.Text.UTF8Encoding($false)))
          # Byte-level regression guard: the capture must be BOM-less UTF-8 for the gate's startswith match.
          $_b = [System.IO.File]::ReadAllBytes("$PWD\survivor_check_step.log")
          if ($_b.Length -ge 2 -and $_b[0] -eq 0xFF -and $_b[1] -eq 0xFE) { Write-Error "ABORT: survivor_check_step.log written UTF-16LE; gate evidence would be unreadable"; exit 1 }
          if ($_b.Length -ge 3 -and $_b[0] -eq 0xEF -and $_b[1] -eq 0xBB -and $_b[2] -eq 0xBF) { Write-Error "ABORT: survivor_check_step.log has a UTF-8 BOM; gate startswith match would fail"; exit 1 }
          exit $rc

      - name: Verify demonstrated timeout gating
        if: always()
        shell: powershell
        run: |
          python proof_runner_probe.py --mode verify-timeout `
            --nonce "$env:PROBE_NONCE" `
            --log probe_timeout.log `
            --timeout-seconds 120 `
            --run-id "${{ github.run_id }}" `
            --check-run-id "${{ job.check_run_id }}" `
            --run-attempt "${{ github.run_attempt }}" `
            --job-name "probe-timeout" `
            --owner "${{ github.repository_owner }}" `
            --repo "${{ github.event.repository.name }}" `
            --stuck-step-outcome "${{ steps.stuck_step.outcome }}"

      - name: Upload probe timeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-timeout-evidence
          path: |
            probe_timeout.log
            probe_timeout_verification.json
            survivor_check_step.log

  probe-account:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simulate killed-run leftover account
        shell: powershell
        run: |
          python proof_runner_probe.py --mode leave --receipt probe_account_receipt.json | Out-File -FilePath probe_account.log -Encoding utf8

      - name: Detect and remove leftover on same runner lifecycle
        if: always()
        shell: powershell
        run: |
          python proof_runner_probe.py --mode cleanup --receipt probe_account_receipt.json --cleanup-evidence probe_account_cleanup.json | Out-File -FilePath probe_account.log -Append -Encoding utf8

      - name: Upload probe account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-account-evidence
          path: |
            probe_account.log
            probe_account_receipt.json
            probe_account_cleanup.json

  proof-p1-p3:
    needs: [probe-timeout, probe-account]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download timeout probe evidence
        uses: actions/download-artifact@v4
        with:
          name: probe-timeout-evidence
          path: probe_evidence/timeout

      - name: Download account probe evidence
        uses: actions/download-artifact@v4
        with:
          name: probe-account-evidence
          path: probe_evidence/account

      - name: Evaluate explicit prerequisites (fail-closed)
        shell: powershell
        run: |
          $expected_sha256 = "e10b703658f3f417a816003d54232bb4fe614a03b38762775a9b1fc61551ed62"
          $eval_path = "proof_gate_evaluate.py"
          if (-not (Test-Path $eval_path)) {
            Write-Error "ABORT: proof_gate_evaluate.py missing"
            exit 1
          }
          $actual_sha256 = (Get-FileHash -Path $eval_path -Algorithm SHA256).Hash.ToLower()
          if ($actual_sha256 -ne $expected_sha256.ToLower()) {
            Write-Error "ABORT: SHA-256 mismatch for proof_gate_evaluate.py: want $expected_sha256, got $actual_sha256"
            exit 1
          }
          python proof_gate_evaluate.py --evidence-root probe_evidence --out proof_gate_eval.json
          exit $LASTEXITCODE

      - name: Diagnose CreateProcessWithLogonW cwd context (bounded)
        timeout-minutes: 5
        shell: powershell
        run: |
          $expected_sha256 = "5e6dd1615591ee3f3db2a42a45529d8ffe70183498ecf665a0f02b76441d9238"
          $diag_path = "proof_cplw_diag.py"
          if (-not (Test-Path $diag_path)) {
            Write-Error "ABORT: proof_cplw_diag.py missing"
            exit 1
          }
          $actual_sha256 = (Get-FileHash -Path $diag_path -Algorithm SHA256).Hash.ToLower()
          if ($actual_sha256 -ne $expected_sha256.ToLower()) {
            Write-Error "ABORT: SHA-256 mismatch for proof_cplw_diag.py: want $expected_sha256, got $actual_sha256"
            exit 1
          }
          python proof_cplw_diag.py --gate proof_gate_eval.json --evidence cplw_diag_evidence.json
          exit $LASTEXITCODE

      - name: P1-P3 narrow proof (hash-verified entrypoint)
        id: proof_step
        timeout-minutes: 15
        shell: powershell
        run: |
          # R-B marker: written BEFORE the python entry. Terminating guard - if the marker
          # cannot be written, the proof entry is NEVER invoked (no marker-less execution).
          # The marker proves this run block started (execution reached this step); it is written
          # before python is invoked so that no marker-less entrypoint invocation can occur.
          try {
            [System.IO.File]::WriteAllText("$PWD\proof_invoked.marker", "run_block_started $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))", (New-Object System.Text.UTF8Encoding($false)))
          } catch { Write-Error "ABORT: proof invocation marker write failed; refusing to start proof: $_"; exit 1 }
          if (-not (Test-Path "proof_invoked.marker")) { Write-Error "ABORT: proof invocation marker absent after write; refusing to start proof"; exit 1 }
          python proof_terminate_scope.py proof_scope_evidence.json
          exit $LASTEXITCODE

      - name: Post-timeout cleanup and sweep
        if: always()
        shell: powershell
        run: |
          # R-B: cleanup honesty when the proof never started (bounded marker design).
          # not_applicable requires ALL THREE:
          #   (1) proof_invoked.marker ABSENT (proof run block never started - written before python entry
          #       with a terminating guard; marker presence proves the run block started);
          #   (2) proof_principal_receipt.json ABSENT;
          #   (3) proof_gate_eval.json parses AND overall_pass IS the exact JSON bool false.
          # A missing marker alone is NOT positive proof; the failed gate plus control flow is the
          # corroboration. Receipt present => ALWAYS the existing fail-closed cleanup. Any parse
          # failure, missing key, or non-bool value => existing fail-closed cleanup. No
          # steps.*.outcome empty/skipped inference. Paths are $PWD-bound on a fresh disposable VM.
          $markerPresent = (Test-Path "proof_invoked.marker")
          $receiptPresent = (Test-Path "proof_principal_receipt.json")
          $gateFalse = $false
          if (Test-Path "proof_gate_eval.json") {
            try {
              $_ge = Get-Content -Raw -Path "proof_gate_eval.json" | ConvertFrom-Json
              if (($_ge.PSObject.Properties.Name -contains "overall_pass") -and ($_ge.overall_pass -is [bool]) -and (-not $_ge.overall_pass)) { $gateFalse = $true }
            } catch { $gateFalse = $false }
          }
          if ((-not $markerPresent) -and (-not $receiptPresent) -and $gateFalse) {
            $_ev = [ordered]@{
              ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              verdict = "not_applicable_no_principal_created"
              reason = "gate overall_pass=false; proof_invoked.marker absent (run block never started); receipt absent"
              marker_present = $false
              receipt_path = "$PWD\proof_principal_receipt.json"
              receipt_read = $false
              target_sid = $null
              terminate_results = @()
              account_existed = $false
              account_deleted = $false
              post_sweep = @{}
            }
            [System.IO.File]::WriteAllText("$PWD\proof_cleanup_evidence.json", ($_ev | ConvertTo-Json), (New-Object System.Text.UTF8Encoding($false)))
            Write-Output "CLEANUP_NOT_APPLICABLE: gate false, marker absent, receipt absent; run block never started"
            exit 0
          }
          python proof_runner_probe.py --mode cleanup --receipt proof_principal_receipt.json --cleanup-evidence proof_cleanup_evidence.json
          exit $LASTEXITCODE

      - name: Upload P1-P3 proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-p3-proof-evidence
          path: |
            proof_scope_evidence.json
            proof_invoked.marker
            proof_principal_receipt.json
            proof_cleanup_evidence.json
            proof_gate_eval.json
            cplw_diag_evidence.json
            diag_principal_receipt.json
            diag_cleanup_evidence.json
